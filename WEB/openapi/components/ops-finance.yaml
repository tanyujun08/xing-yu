        "status",
        "resolution_kind",
        "resolution_ref",
        "resolved_at",
        "version",
        "replayed"
      ],
      "properties": {
        "item_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "batch_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "status": {
          "type": "string",
          "enum": [
            "RESOLVED"
          ]
        },
        "resolution_kind": {
          "type": "string",
          "enum": [
            "REQUERY_ORIGIN",
            "POST_APPROVED_ADJUSTMENT"
          ]
        },
        "resolution_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "query_job_id": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "journal_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "resolved_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        },
        "version": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "replayed": {
          "type": "boolean"
        }
      }
    },
    "CashBalance": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "currency",
        "available_fen",
        "frozen_fen",
        "withdrawable_fen",
        "as_of_at"
      ],
      "properties": {
        "currency": {
          "type": "string",
          "enum": [
            "CNY"
          ]
        },
        "available_fen": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]{0,18})$"
        },
        "frozen_fen": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]{0,18})$"
        },
        "withdrawable_fen": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]{0,18})$"
        },
        "as_of_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        }
      }
    },
    "WithdrawalProjection": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "withdrawal_id",
        "amount_fen",
        "currency",
        "provider",
        "provider_config_version_id",
        "status",
        "frozen_journal_id",
        "created_at",
        "updated_at",
        "version"
      ],
      "properties": {
        "withdrawal_id": {
          "type": "string",
          "minLength": 1,
