        "prizes": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "prize_code",
              "enabled",
              "remaining_qty",
              "pink_reward_units",
              "rights_display"
            ],
            "properties": {
              "prize_code": {
