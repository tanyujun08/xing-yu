{
  "Schemas": {
    "CouponType": {
      "type": "string",
      "enum": [
        "DEPOSIT_WAIVER",
        "PUBLISH_ONCE",
        "ONE_DAY_RENT",
        "GUARD_DISCOUNT"
      ]
    },
    "PrizeCode": {
      "type": "string",
      "enum": [
        "DEPOSIT_WAIVER",
        "PUBLISH_ONCE",
        "ONE_DAY_RENT",
        "GUARD_DISCOUNT",
        "PINK"
      ]
    },
    "CouponRights": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "deposit_waiver"
          ],
          "properties": {
            "kind": {
              "const": "DEPOSIT_WAIVER"
            },
            "deposit_waiver": {
              "const": "FULL"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "publish_quota_qty"
          ],
          "properties": {
            "kind": {
              "const": "PUBLISH_ONCE"
            },
            "publish_quota_qty": {
              "const": "1"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "rent_day_qty"
          ],
          "properties": {
            "kind": {
              "const": "ONE_DAY_RENT"
            },
            "rent_day_qty": {
              "const": "1"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "currency",
            "insurance_discount_fen"
          ],
          "properties": {
            "kind": {
              "const": "GUARD_DISCOUNT"
            },
            "currency": {
              "const": "CNY"
            },
            "insurance_discount_fen": {
              "type": "string",
              "pattern": "^[1-9][0-9]*$",
              "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
            }
          }
        }
      ]
    },
    "CouponsPolicy": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "coupons"
      ],
      "properties": {
        "coupons": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "coupon_type",
              "enabled",
              "insurance_discount_fen"
            ],
            "properties": {
              "coupon_type": {
                "$ref": "#/Schemas/CouponType"
              },
              "enabled": {
                "type": "boolean"
              },
              "insurance_discount_fen": {
                "anyOf": [
                  {
                    "type": "string",
                    "pattern": "^[1-9][0-9]*$",
                    "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            }
          },
          "minItems": 4,
          "maxItems": 4
        }
      }
    },
    "LotteryPolicy": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "pool_code",
        "enabled",
        "cost_pink_units",
        "no_win_probability_bps",
        "prizes"
      ],
      "properties": {
        "pool_code": {
          "type": "string",
          "const": "MAIN"
        },
        "enabled": {
          "type": "boolean"
        },
        "cost_pink_units": {
          "type": "string",
          "pattern": "^[1-9][0-9]*$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "no_win_probability_bps": {
          "type": "integer",
          "minimum": 0,
          "maximum": 10000
        },
        "prizes": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "prize_code",
              "enabled",
              "probability_bps",
              "total_qty",
              "pink_reward_units"
            ],
            "properties": {
              "prize_code": {
                "$ref": "#/Schemas/PrizeCode"
              },
              "enabled": {
                "type": "boolean"
              },
              "probability_bps": {
                "type": "integer",
                "minimum": 0,
                "maximum": 10000
              },
              "total_qty": {
                "type": "string",
                "pattern": "^(0|[1-9][0-9]*)$",
                "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
              },
              "pink_reward_units": {
                "anyOf": [
                  {
                    "type": "string",
                    "pattern": "^[1-9][0-9]*$",
                    "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            }
          },
          "minItems": 5,
          "maxItems": 5
        }
      }
    },
    "LotteryInventory": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "prize_code",
        "total_qty",
        "issued_qty",
        "remaining_qty",
        "version"
      ],
      "properties": {
        "prize_code": {
          "$ref": "#/Schemas/PrizeCode"
        },
        "total_qty": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "issued_qty": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "remaining_qty": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "version": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        }
      }
    },
    "LoyaltyEffectiveConfig": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "config_key",
        "config_version_id",
        "effective_epoch",
        "value",
        "effective_at",
        "saved_by"
      ],
      "properties": {
        "config_key": {
          "type": "string",
          "enum": [
            "benefits.coupons",
            "benefits.lottery"
          ]
        },
        "config_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "effective_epoch": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "value": {
          "oneOf": [
            {
              "$ref": "#/Schemas/CouponsPolicy"
            },
            {
              "$ref": "#/Schemas/LotteryPolicy"
            }
          ]
        },
        "effective_at": {
          "type": "string",
          "format": "date-time"
        },
        "saved_by": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        }
      }
    },
    "LoyaltyEffectiveConfigResult": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "current",
        "inventory",
        "as_of_at"
      ],
      "properties": {
        "current": {
          "anyOf": [
            {
              "$ref": "#/Schemas/LoyaltyEffectiveConfig"
            },
            {
              "type": "null"
            }
          ]
        },
        "inventory": {
          "anyOf": [
            {
              "type": "array",
              "items": {
                "$ref": "#/Schemas/LotteryInventory"
              },
              "minItems": 5,
              "maxItems": 5
            },
            {
              "type": "null"
            }
          ]
        },
        "as_of_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "LoyaltyConfigSaveRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "base_effective_epoch",
        "value",
        "reason"
      ],
      "properties": {
        "base_effective_epoch": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "value": {
          "oneOf": [
            {
              "$ref": "#/Schemas/CouponsPolicy"
            },
            {
              "$ref": "#/Schemas/LotteryPolicy"
            }
          ]
        },
        "reason": {
          "type": "string",
          "minLength": 3,
          "maxLength": 256
        }
      }
    },
    "LoyaltyConfigSaveResult": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "config_version_id",
        "effective_epoch",
        "effective_at",
        "saved_by",
        "current",
        "inventory",
        "replayed",
        "operation_event_id"
      ],
      "properties": {
        "config_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "effective_epoch": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "effective_at": {
          "type": "string",
          "format": "date-time"
        },
        "saved_by": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "current": {
          "$ref": "#/Schemas/LoyaltyEffectiveConfig"
        },
        "inventory": {
          "anyOf": [
            {
              "type": "array",
              "items": {
                "$ref": "#/Schemas/LotteryInventory"
              },
              "minItems": 5,
              "maxItems": 5
            },
            {
              "type": "null"
            }
          ]
        },
        "replayed": {
          "type": "boolean"
        },
        "operation_event_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        }
      }
    },
    "LoyaltyConfigVersion": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "config_version_id",
        "config_key",
        "effective_epoch",
        "value",
        "saved_by",
        "effective_at",
        "reason",
        "content_hash",
        "operation_event_id",
        "field_changes",
        "inventory_movements"
      ],
      "properties": {
        "config_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "config_key": {
          "type": "string"
        },
        "effective_epoch": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "value": {
          "oneOf": [
            {
              "$ref": "#/Schemas/CouponsPolicy"
            },
            {
              "$ref": "#/Schemas/LotteryPolicy"
            }
          ]
        },
        "saved_by": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "effective_at": {
          "type": "string",
          "format": "date-time"
        },
        "reason": {
          "type": "string"
        },
        "content_hash": {
          "type": "string"
        },
        "operation_event_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "field_changes": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "before_value": {
                "type": [
                  "string",
                  "integer",
                  "boolean",
                  "null"
                ]
              },
              "after_value": {
                "type": [
                  "string",
                  "integer",
                  "boolean",
                  "null"
                ]
              },
              "field": {
                "type": "string"
              }
            },
            "required": [
              "field",
              "before_value",
              "after_value"
            ]
          }
        },
        "inventory_movements": {
          "type": "array",
          "items": {
            "$ref": "#/Schemas/LotteryMovement"
          }
        }
      }
    },
    "CouponStatusEvent": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "event_id",
        "from_status",
        "to_status",
        "action",
        "redemption_id",
        "request_id",
        "actor_kind",
        "occurred_at"
      ],
      "properties": {
        "event_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "from_status": {
          "anyOf": [
            {
              "type": "string",
              "const": "AVAILABLE"
            },
            {
              "type": "null"
            }
          ]
        },
        "to_status": {
          "type": "string",
          "enum": [
            "AVAILABLE",
            "REDEEMED"
          ]
        },
        "action": {
          "type": "string",
          "enum": [
            "ISSUED",
            "REDEEMED"
          ]
        },
        "redemption_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "request_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "actor_kind": {
          "type": "string"
        },
        "occurred_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "MemberCoupon": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "coupon_id",
        "account_id",
        "coupon_type",
        "rights_snapshot",
        "status",
        "source_grant_id",
        "source_kind",
        "source_id",
        "source_draw_id",
        "coupon_config_version_id",
        "issued_at",
        "version",
        "allowed_actions"
      ],
      "properties": {
        "coupon_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "account_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "coupon_type": {
          "$ref": "#/Schemas/CouponType"
        },
        "rights_snapshot": {
          "$ref": "#/Schemas/CouponRights"
        },
        "status": {
          "type": "string",
          "enum": [
            "AVAILABLE",
            "REDEEMED"
          ]
        },
        "source_grant_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "source_kind": {
          "type": "string",
          "enum": [
            "CHECK_IN",
            "PROGRESS",
            "REDEMPTION",
            "LOTTERY"
          ]
        },
        "source_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "source_draw_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "coupon_config_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "issued_at": {
          "type": "string",
          "format": "date-time"
        },
        "version": {
          "type": "string",
          "pattern": "^[1-9][0-9]*$",
          "description": "Canonical decimal signed BIGINT, maximum 9223372036854775807."
        },
        "allowed_actions": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "can_redeem"
          ],
          "properties": {
            "can_redeem": {
              "type": "boolean"
            }
          }
        }
      }
    },
