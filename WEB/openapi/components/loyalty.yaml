    "LotteryState": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "account_id",
        "enabled",
        "blocked_reason",
        "cost_pink_units",
        "available_pink_units",
        "lottery_config_version_id",
        "coupon_config_version_id",
        "prizes",
        "as_of_at"
      ],
      "properties": {
        "account_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "enabled": {
          "type": "boolean"
        },
        "blocked_reason": {
          "anyOf": [
            {
