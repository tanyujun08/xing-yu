        "name",
        "address",
        "province_name",
        "city_name",
        "district_name",
        "business_hours",
        "status",
        "archive_reason",
        "version",
        "created_at",
        "updated_at",
        "location_verified_at",
        "allowed_actions",
        "blocked_reasons"
      ],
      "properties": {
        "store_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "merchant_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "responsible_lessor_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "address": {
          "$ref": "#/Schemas/StoreAddress"
        },
        "province_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80
        },
        "city_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80
        },
        "district_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80
        },
        "business_hours": {
          "$ref": "#/Schemas/BusinessHours"
        },
        "status": {
          "type": "string",
          "enum": [
            "ACTIVE",
            "ARCHIVED"
          ]
        },
        "archive_reason": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 500
            },
            {
              "type": "null"
            }
          ]
        },
        "version": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,19}$"
        },
        "created_at": {
          "type": "string",
          "format": "date-time"
        },
        "updated_at": {
          "type": "string",
          "format": "date-time"
        },
        "location_verified_at": {
          "anyOf": [
            {
              "type": "string",
              "format": "date-time"
            },
            {
              "type": "null"
            }
          ]
        },
        "allowed_actions": {
          "type": "array",
          "items": {
            "$ref": "./merchants.yaml#/Schemas/MerchantAction"
          }
        },
        "blocked_reasons": {
          "type": "array",
          "items": {
            "$ref": "./addresses.yaml#/Schemas/ReasonItem"
          }
        },
        "photo_material_ids": {
          "type": "array",
          "maxItems": 9,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 5,
            "maxLength": 64,
            "pattern": "^mat_[!-~]+$"
          },
          "description": "Ordered READY system image materials. Empty array removes photos. Binding pins the object."
        }
      }
    },
    "StoreInput": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "responsible_lessor_id",
        "name",
        "address",
        "business_hours"
      ],
      "properties": {
        "merchant_id": {
          "anyOf": [
            {
              "type": "string",
