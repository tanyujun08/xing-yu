        },
        "address": {
          "$ref": "#/Schemas/StoreAddress"
        },
        "business_hours": {
          "$ref": "#/Schemas/BusinessHours"
        },
        "photo_material_ids": {
          "type": "array",
          "maxItems": 9,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 5,
            "maxLength": 64,
            "pattern": "^mat_[!-~]+$"
          },
          "description": "Ordered READY system image materials. Empty array removes photos. Binding pins the object."
        }
      }
    },
    "StorePatch": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "reason"
      ],
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "address": {
          "$ref": "#/Schemas/StoreAddress"
        },
        "business_hours": {
          "$ref": "#/Schemas/BusinessHours"
        },
        "reason": {
          "type": "string",
          "minLength": 1,
          "maxLength": 500
        },
        "photo_material_ids": {
          "type": "array",
          "maxItems": 9,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 5,
            "maxLength": 64,
            "pattern": "^mat_[!-~]+$"
          },
          "description": "Ordered READY system image materials. Empty array removes photos. Binding pins the object."
        }
      },
      "anyOf": [
        {
          "required": [
            "name"
          ]
        },
        {
          "required": [
            "address"
          ]
        },
        {
          "required": [
            "business_hours"
          ]
        }
      ]
    },
    "StoreReason": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "reason"
      ],
      "properties": {
        "reason": {
          "type": "string",
          "minLength": 1,
          "maxLength": 500
        }
      }
    },
    "StorePage": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "items",
        "page"
      ],
      "properties": {
        "items": {
          "type": "array",
          "maxItems": 100,
          "items": {
            "$ref": "#/Schemas/StoreView"
          }
        },
        "page": {
          "$ref": "./pagination.yaml#/CursorPageMeta"
        }
      }
    }
  }
}
