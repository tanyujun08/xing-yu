        "maxLength": 64
      },
      "task_code": {
        "type": "string",
        "enum": [
          "REGISTER",
          "VIEW_ASSET"
        ]
      },
      "period": {
        "type": "string",
        "enum": [
          "LIFETIME",
          "DAY",
          "MONTH"
        ]
      },
      "limit": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000
      },
      "rewards": {
        "type": "array",
        "items": {
          "$ref": "#/RewardItem"
        },
        "minItems": 0,
        "maxItems": 20
      }
    }
  },
  "BenefitRedemption": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "offer_code",
      "cost_pink_units",
      "period",
      "limit",
      "rewards"
    ],
    "properties": {
      "offer_code": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64
      },
      "cost_pink_units": {
        "$ref": "#/PolicyUnits"
      },
      "period": {
        "type": "string",
        "enum": [
          "LIFETIME",
          "DAY",
          "MONTH"
        ]
      },
      "limit": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000
      },
      "rewards": {
        "type": "array",
        "items": {
          "$ref": "#/RewardItem"
        },
        "minItems": 1,
        "maxItems": 20
      }
    }
  },
  "LotteryRulesPolicy": {
    "$ref": "./loyalty.yaml#/Schemas/LotteryPolicy"
  },
  "ClientResourcesPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "client",
      "channel",
      "entries"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "client": {
        "type": "string",
        "enum": [
          "MINIPROGRAM",
          "ADMIN"
        ]
      },
      "channel": {
        "type": "string",
        "minLength": 1,
        "maxLength": 32
      },
      "entries": {
        "type": "array",
        "items": {
          "$ref": "#/ClientResource"
        },
        "minItems": 1,
        "maxItems": 200
      }
    }
  },
  "ClientResource": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "resource_key",
      "locale",
      "theme",
