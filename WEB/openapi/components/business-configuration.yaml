      "schema_version",
      "scenes"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "scenes": {
        "type": "array",
        "items": {
          "$ref": "#/WechatMessageScene"
        },
        "minItems": 0,
        "maxItems": 5
      }
    }
  },
  "WechatMessageScene": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "scene",
      "template_id",
      "parameter_map",
      "page_path",
      "enabled"
    ],
    "properties": {
      "scene": {
