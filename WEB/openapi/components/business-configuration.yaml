{
  "PolicyUnits": {
    "type": "string",
    "pattern": "^(0|[1-9][0-9]{0,18})$",
    "maxLength": 19,
    "description": "Canonical nonnegative integer string, maximum 9223372036854775807. Money is CNY fen; GROWTH is stored in tenths of displayed starlight; PINK is an integer diamond count with no scaling. The server validates the upper bound."
  },
  "RentalRequirementsPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "rules"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "rules": {
        "type": "array",
        "items": {
          "$ref": "#/RentalRequirementsRule"
        },
        "minItems": 1,
        "maxItems": 6
      }
    }
  },
  "RentalRequirementsRule": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "business_mode",
      "supply_type",
      "rental_mode",
      "identity_required",
      "contract_required",
      "allowed_delivery_methods",
      "payment_deadline_seconds",
      "approval_deadline_seconds"
    ],
    "properties": {
      "business_mode": {
        "type": "string",
        "enum": [
          "C2C",
          "B2C"
        ]
      },
      "supply_type": {
        "type": "string",
        "enum": [
          "PERSONAL",
          "STORE",
          "CABINET"
        ]
      },
      "rental_mode": {
        "type": "string",
        "enum": [
          "HOUR",
          "DAY"
        ]
      },
      "identity_required": {
        "type": "boolean"
      },
      "contract_required": {
        "type": "boolean"
      },
      "allowed_delivery_methods": {
        "type": "array",
        "items": {
          "type": "string",
          "enum": [
            "EXPRESS",
            "RUNNER",
            "MEET",
            "CABINET"
          ]
        },
        "minItems": 1,
        "maxItems": 4,
        "uniqueItems": true
      },
      "payment_deadline_seconds": {
        "type": "integer",
        "minimum": 1,
        "maximum": 604800
      },
      "approval_deadline_seconds": {
        "anyOf": [
          {
            "type": "integer",
            "minimum": 1,
            "maximum": 604800
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "RentalBillingPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "rules"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "rules": {
        "type": "array",
        "items": {
          "$ref": "#/RentalBillingRule"
        },
        "minItems": 1,
        "maxItems": 6
      }
    }
  },
  "RentalBillingRule": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "business_mode",
      "supply_type",
      "rental_mode",
      "unit",
      "rounding",
      "minimum_units",
      "grace_seconds",
      "cap_fen",
      "overdue_enabled",
      "overdue_unit_price_fen"
    ],
    "properties": {
      "business_mode": {
        "type": "string",
        "enum": [
          "C2C",
          "B2C"
        ]
      },
      "supply_type": {
        "type": "string",
        "enum": [
          "PERSONAL",
          "STORE",
          "CABINET"
        ]
      },
      "rental_mode": {
        "type": "string",
        "enum": [
          "HOUR",
          "DAY"
        ]
      },
      "unit": {
        "type": "string",
        "enum": [
          "HOUR",
          "DAY"
        ]
      },
      "rounding": {
        "type": "string",
        "enum": [
          "CEIL_UNIT"
        ]
      },
      "minimum_units": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000000
      },
      "grace_seconds": {
        "type": "integer",
        "minimum": 0,
        "maximum": 604800
      },
      "cap_fen": {
        "anyOf": [
          {
            "$ref": "#/PolicyUnits"
          },
          {
            "type": "null"
          }
        ]
      },
      "overdue_enabled": {
        "type": "boolean"
      },
      "overdue_unit_price_fen": {
        "anyOf": [
          {
            "$ref": "#/PolicyUnits"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "RentalDepositPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "rules"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "rules": {
        "type": "array",
        "items": {
          "$ref": "#/RentalDepositRule"
        },
        "minItems": 1,
        "maxItems": 6
      }
    }
  },
  "UnitRatio": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "numerator",
      "denominator"
    ],
    "properties": {
      "numerator": {
        "$ref": "#/PolicyUnits"
      },
      "denominator": {
        "$ref": "#/PolicyUnits"
      }
    }
  },
  "RentalDepositRule": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "supply_type",
      "rental_mode",
      "allowed_methods",
      "pink_units_per_fen",
      "pink_max_waiver_fen"
    ],
    "properties": {
      "supply_type": {
        "type": "string",
        "enum": [
          "PERSONAL",
          "STORE",
          "CABINET"
        ]
      },
      "rental_mode": {
        "type": "string",
        "enum": [
          "HOUR",
          "DAY"
        ]
      },
      "allowed_methods": {
        "type": "array",
        "items": {
          "type": "string",
          "enum": [
            "CASH",
            "MEMBERSHIP",
            "PINK_PARTIAL"
          ]
        },
        "minItems": 1,
        "maxItems": 3,
        "uniqueItems": true
      },
      "pink_units_per_fen": {
        "anyOf": [
          {
            "$ref": "#/UnitRatio"
          },
          {
            "type": "null"
          }
        ]
      },
      "pink_max_waiver_fen": {
        "$ref": "#/PolicyUnits"
      }
    }
  },
  "MembershipLevelsPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "levels"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "levels": {
        "type": "array",
        "items": {
          "$ref": "#/MembershipLevel"
        },
        "minItems": 1,
        "maxItems": 20
      }
    }
  },
  "MembershipLevel": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "level_code",
      "name",
      "order",
      "upgrade_growth_units",
      "waiver_count_per_month",
      "waiver_mode",
      "waiver_cap_fen",
      "eligible_modes",
      "eligible_categories"
    ],
    "properties": {
      "level_code": {
        "type": "string",
        "minLength": 1,
        "maxLength": 32,
        "pattern": "^[!-~]{1,32}$"
      },
      "name": {
        "type": "string",
        "minLength": 1,
        "maxLength": 80
      },
      "order": {
        "type": "integer",
        "minimum": 0,
        "maximum": 19
      },
      "upgrade_growth_units": {
        "$ref": "#/PolicyUnits"
      },
      "waiver_count_per_month": {
        "type": "integer",
        "minimum": 0,
        "maximum": 1000
      },
      "waiver_mode": {
        "type": "string",
        "enum": [
          "FULL",
          "CAPPED"
        ]
      },
      "waiver_cap_fen": {
        "anyOf": [
          {
            "$ref": "#/PolicyUnits"
          },
          {
            "type": "null"
          }
        ]
      },
      "eligible_modes": {
        "type": "array",
        "items": {
          "type": "string",
          "enum": [
            "DAY"
          ]
        },
        "minItems": 1,
        "maxItems": 2,
        "uniqueItems": true
      },
      "eligible_categories": {
        "type": "array",
        "items": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "minItems": 0,
        "maxItems": 1000,
        "uniqueItems": true
      }
    }
  },
  "EntitlementCatalogPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "offers"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "offers": {
        "type": "array",
        "items": {
          "$ref": "#/EntitlementOffer"
        },
        "minItems": 1,
        "maxItems": 100
      }
    }
  },
  "EntitlementOffer": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "offer_code",
      "kind",
      "cost_unit",
      "unit_price",
      "min_quantity",
      "max_quantity",
      "valid_days",
      "refund_policy"
    ],
    "properties": {
      "offer_code": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64
      },
      "kind": {
        "type": "string",
        "enum": [
          "CONTRACT",
          "PUBLISH_QUOTA"
        ]
      },
      "cost_unit": {
        "type": "string",
        "enum": [
          "CNY",
          "PINK_POINT"
        ]
      },
      "unit_price": {
        "$ref": "#/PolicyUnits"
      },
      "min_quantity": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000
      },
      "max_quantity": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000
      },
      "valid_days": {
        "anyOf": [
          {
            "type": "integer",
            "minimum": 1,
            "maximum": 36500
          },
          {
            "type": "null"
          }
        ]
      },
      "refund_policy": {
        "type": "string",
        "enum": [
          "CONTRACT_UNUSED_FULL",
          "NONE"
        ]
      }
    }
  },
  "SettlementRulesPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "fee_basis",
      "platform_fee_basis_points",
      "wallet_only",
      "withdrawal_min_fen",
      "withdrawal_max_fen"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "fee_basis": {
        "type": "string",
        "enum": [
          "COLLECTED_RENT"
        ]
      },
      "platform_fee_basis_points": {
        "type": "integer",
        "minimum": 0,
        "maximum": 10000
      },
      "wallet_only": {
        "type": "boolean",
        "const": true
      },
      "withdrawal_min_fen": {
        "$ref": "#/PolicyUnits"
      },
      "withdrawal_max_fen": {
        "$ref": "#/PolicyUnits"
      }
    }
  },
  "CabinetCredentialPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "digits",
      "code_ttl_seconds",
      "verification_window_seconds",
      "max_failed_attempts",
      "session_ttl_seconds",
      "replay_policy"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "digits": {
        "type": "integer",
        "minimum": 6,
        "maximum": 6
      },
      "code_ttl_seconds": {
        "type": "null"
      },
      "verification_window_seconds": {
        "type": "integer",
        "minimum": 60,
        "maximum": 3600
      },
      "max_failed_attempts": {
        "type": "integer",
        "minimum": 1,
        "maximum": 20
      },
      "session_ttl_seconds": {
        "type": "integer",
        "minimum": 60,
        "maximum": 900
      },
      "replay_policy": {
        "type": "string",
        "enum": [
          "QUERY_ORIGINAL"
        ]
      }
    }
  },
  "AssetPriceGuidancePolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "rules"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "rules": {
        "type": "array",
        "items": {
          "$ref": "#/AssetPriceGuidanceRule"
        },
        "minItems": 0,
        "maxItems": 1000
      }
    }
  },
  "AssetPriceGuidanceRule": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "category_id",
      "rental_unit",
      "min_unit_price_fen",
      "max_unit_price_fen",
      "recommended_unit_price_fen"
    ],
    "properties": {
      "category_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64
      },
      "rental_unit": {
        "type": "string",
        "enum": [
          "HOUR",
          "DAY"
        ]
      },
      "min_unit_price_fen": {
        "$ref": "#/PolicyUnits"
      },
      "max_unit_price_fen": {
        "$ref": "#/PolicyUnits"
      },
      "recommended_unit_price_fen": {
        "anyOf": [
          {
            "$ref": "#/PolicyUnits"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "RewardItem": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "kind",
      "units",
      "quantity",
      "coupon_type",
      "valid_days"
    ],
    "properties": {
      "kind": {
        "type": "string",
        "enum": [
          "PINK",
          "GROWTH",
          "CONTRACT",
          "PUBLISH_QUOTA",
          "COUPON"
        ]
      },
      "units": {
        "anyOf": [
          {
            "$ref": "#/PolicyUnits"
          },
          {
            "type": "null"
          }
        ]
      },
      "quantity": {
        "anyOf": [
          {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000
          },
          {
            "type": "null"
          }
        ]
      },
      "valid_days": {
        "anyOf": [
          {
            "type": "integer",
            "minimum": 1,
            "maximum": 36500
          },
          {
            "type": "null"
          }
        ]
      },
      "coupon_type": {
        "anyOf": [
          {
            "$ref": "./loyalty.yaml#/Schemas/CouponType"
          },
          {
            "type": "null"
          }
        ]
      }
    },
    "description": "Coupon rewards require coupon_type and quantity; valid_days is null for coupons. valid_days remains an entitlement lifetime setting only. Positive reward units; empty reward arrays produce no grant."
  },
  "CheckInPolicy": {
    "$ref": "./business-config-direct.yaml#/CheckInPolicyV2"
  },
  "BenefitCatalogPolicy": {
