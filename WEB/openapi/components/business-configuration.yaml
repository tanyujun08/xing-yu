      "redemptions"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "tasks": {
        "type": "array",
        "items": {
          "$ref": "#/BenefitTask"
        },
        "minItems": 0,
        "maxItems": 100
      },
      "redemptions": {
        "type": "array",
        "items": {
          "$ref": "#/BenefitRedemption"
        },
        "minItems": 0,
        "maxItems": 100
      }
    }
  },
  "BenefitTask": {
    "type": "object",
