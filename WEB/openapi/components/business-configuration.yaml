  "WechatMessageParameter": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "provider_parameter",
      "source"
    ],
    "properties": {
      "provider_parameter": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64
      },
      "source": {
        "type": "string",
        "enum": [
          "ORDER_NO",
          "ASSET_NAME",
          "DUE_AT",
          "AMOUNT_FEN",
          "STORE_NAME"
        ]
      }
    }
  },
  "AdministrativeRegionsPolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "dataset_code",
      "source_name",
      "source_material_id",
      "source_sha256",
      "imported_count",
      "imported_at"
    ],
    "properties": {
      "schema_version": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1
      },
      "dataset_code": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64
      },
      "source_name": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128
      },
      "source_material_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64
      },
      "source_sha256": {
        "type": "string",
        "minLength": 64,
        "maxLength": 64,
        "pattern": "^[0-9a-f]{64}$"
      },
      "imported_count": {
        "type": "integer",
        "minimum": 1,
        "maximum": 100000
      },
      "imported_at": {
        "type": "string",
        "minLength": 20,
        "maxLength": 30,
        "format": "date-time"
      }
    }
  },
  "StorageRoutePolicy": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "schema_version",
      "provider",
      "region_id",
      "bucket",
      "endpoint_alias",
      "object_prefix",
