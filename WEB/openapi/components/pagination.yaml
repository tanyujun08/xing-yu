CursorPageMeta:
  type: object
  additionalProperties: false
  required: [page_size, has_more]
  properties:
    page_size:
      type: integer
      minimum: 1
      maximum: 100
    has_more:
      type: boolean
    next_cursor:
      type: string
      minLength: 1
      maxLength: 4096

OffsetPageMeta:
  type: object
  additionalProperties: false
  required: [page, page_size, total_items, total_pages]
  properties:
    page:
      type: integer
      minimum: 1
    page_size:
      type: integer
      minimum: 1
      maximum: 100
    total_items:
      type: string
      pattern: ^[0-9]+$
    total_pages:
      type: integer
      minimum: 0

PageSizeParameter:
  name: page_size
  in: query
  required: false
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100

CursorParameter:
  name: cursor
  in: query
  required: false
  schema:
    type: string
    minLength: 1
    maxLength: 4096

PageParameter:
  name: page
  in: query
  required: false
  schema:
    type: integer
    default: 1
    minimum: 1

