{
  "Schemas": {
    "CatalogReason": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "reason": {
          "type": "string",
          "minLength": 1,
          "maxLength": 500
        }
      },
      "required": [
        "reason"
      ]
    },
    "CatalogBrand": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "brand_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80
        },
        "status": {
          "type": "string",
          "enum": [
            "ACTIVE",
            "ARCHIVED"
          ]
        },
        "version": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,19}$"
        },
        "created_at": {
          "type": "string",
          "format": "date-time"
        },
        "updated_at": {
          "type": "string",
          "format": "date-time"
        }
      },
      "required": [
        "brand_id",
        "name",
        "status",
        "version",
        "created_at",
        "updated_at"
      ]
    },
    "CatalogBrandView": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "brand_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
