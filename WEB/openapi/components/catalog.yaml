          ]
        },
        "version": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,19}$"
        },
        "created_at": {
          "type": "string",
          "format": "date-time"
        },
        "updated_at": {
          "type": "string",
          "format": "date-time"
        },
        "allowed_actions": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "UPDATE",
                  "DEACTIVATE"
                ]
              },
              "enabled": {
                "type": "boolean"
              },
              "blocked_reasons": {
                "type": "array",
                "items": {
                  "$ref": "./addresses.yaml#/Schemas/ReasonItem"
                }
              }
            },
            "required": [
              "code",
              "enabled",
              "blocked_reasons"
            ]
          }
        },
        "blocked_reasons": {
          "type": "array",
          "items": {
            "$ref": "./addresses.yaml#/Schemas/ReasonItem"
          }
        }
      },
      "required": [
        "brand_id",
        "name",
        "status",
        "version",
        "created_at",
        "updated_at",
        "allowed_actions",
        "blocked_reasons"
      ]
    },
    "CatalogBrandInput": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80
        }
      },
      "required": [
        "name"
      ]
    },
    "CatalogBrandPatch": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80
        },
        "reason": {
          "type": "string",
          "minLength": 1,
          "maxLength": 500
        }
      },
      "required": [
        "reason"
      ],
      "description": "At least one business field required. Omitted parent_id keeps the parent; null explicitly moves to root. Names use NFC+trim preserving case. Archived names remain reserved."
    },
    "CatalogBrandPage": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "items": {
          "type": "array",
          "items": {
            "$ref": "#/Schemas/CatalogBrandView"
          }
        },
        "page": {
          "$ref": "./pagination.yaml#/CursorPageMeta"
        }
      },
      "required": [
        "items",
        "page"
      ]
    },
