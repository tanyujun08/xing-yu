        "latest_revision_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "display_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "latest_review_status": {
          "anyOf": [
            {
              "type": "string",
              "enum": [
                "PENDING",
                "APPROVED",
                "REJECTED"
              ]
            },
            {
              "type": "null"
            }
          ]
        },
        "publish_status": {
          "type": "string",
          "enum": [
            "OFFLINE",
            "ONLINE"
          ]
        },
        "availability_status": {
          "type": "string",
          "enum": [
            "AVAILABLE",
            "RESERVED",
            "IN_USE",
            "INSPECTION",
            "FROZEN",
            "RETIRED"
          ]
        },
        "first_listed_at": {
          "anyOf": [
            {
              "type": "string",
              "format": "date-time"
            },
            {
              "type": "null"
