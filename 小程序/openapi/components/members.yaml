    "MemberDossier": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "profile",
        "point_accounts",
        "entitlements",
        "allowances",
        "as_of_at"
      ],
      "properties": {
        "profile": {
          "$ref": "#/Schemas/MemberSummary"
        },
        "point_accounts": {
          "type": "array",
          "items": {
            "$ref": "#/Schemas/MemberPointAccount"
          }
        },
        "entitlements": {
          "type": "array",
          "items": {
            "$ref": "#/Schemas/MemberEntitlementAccount"
          }
        },
        "allowances": {
          "type": "array",
          "items": {
            "$ref": "#/Schemas/MemberAllowance"
          }
        },
        "as_of_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
