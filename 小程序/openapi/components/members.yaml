          "type": "string"
        },
        "checked_in_at": {
          "type": "string",
          "format": "date-time"
        },
        "previous_check_in_id": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1,
          "maxLength": 64
        },
        "streak_days": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        },
        "cumulative_days": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        },
        "rule_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        }
      }
