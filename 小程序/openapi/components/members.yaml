        }
      }
    },
    "OwnPointEntry": {
      "$ref": "./loyalty.yaml#/Schemas/PointEntryDetail"
    },
    "OwnPointStatistics": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "timezone",
        "day_start",
        "week_start",
        "today_earned_delta",
        "week_earned_delta",
        "month_start",
        "month_increase_units",
        "month_decrease_units"
      ],
      "properties": {
        "timezone": {
          "enum": [
            "Asia/Shanghai"
          ],
          "type": "string"
        },
        "day_start": {
          "type": "string",
          "format": "date-time"
        },
        "week_start": {
          "type": "string",
          "format": "date-time"
        },
        "today_earned_delta": {
          "type": "string",
          "maxLength": 20,
          "description": "Signed int64 smallest point units; PINK integer, GROWTH tenths. Never a floating point number.",
          "pattern": "^-?(0|[1-9][0-9]{0,18})$"
        },
        "week_earned_delta": {
          "type": "string",
          "maxLength": 20,
          "description": "Signed int64 smallest point units; PINK integer, GROWTH tenths. Never a floating point number.",
          "pattern": "^-?(0|[1-9][0-9]{0,18})$"
        },
        "month_start": {
          "format": "date-time",
          "type": "string"
        },
        "month_increase_units": {
          "maxLength": 65,
          "type": "string",
          "description": "Exact nonnegative calendar-month aggregate of available_delta + reserved_delta. Independent of direction and pagination; may exceed int64. PINK integer units, GROWTH tenths.",
          "pattern": "^(0|[1-9][0-9]{0,64})$"
        },
        "month_decrease_units": {
          "maxLength": 65,
          "type": "string",
          "description": "Exact nonnegative calendar-month aggregate of available_delta + reserved_delta. Independent of direction and pagination; may exceed int64. PINK integer units, GROWTH tenths.",
          "pattern": "^(0|[1-9][0-9]{0,64})$"
        }
      }
    },
    "OwnPointEntryPage": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "account_id",
        "account",
        "items",
        "statistics",
        "as_of_at",
        "page"
      ],
      "properties": {
        "account_id": {
          "type": "string",
          "maxLength": 64,
          "minLength": 1
        },
        "account": {
          "$ref": "#/Schemas/MemberPointAccount"
        },
        "items": {
          "items": {
            "$ref": "#/Schemas/OwnPointEntry"
          },
          "type": "array"
        },
        "statistics": {
          "$ref": "#/Schemas/OwnPointStatistics"
        },
        "as_of_at": {
          "type": "string",
          "format": "date-time"
        },
        "page": {
          "type": "object",
          "required": [
            "next_cursor"
          ],
          "additionalProperties": false,
          "properties": {
            "next_cursor": {
              "type": [
                "string",
                "null"
              ]
            }
          }
        }
      }
    }
