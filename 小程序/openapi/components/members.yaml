        },
        "cycle_key": {
          "type": "string"
        },
        "cycle_start": {
          "type": "string",
          "format": "date-time"
        },
        "cycle_end": {
          "type": "string",
          "format": "date-time"
        },
        "granted_count": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "reserved_count": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "consumed_count": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "revoked_count": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "available_count": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "initial_membership_period_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        }
      }
