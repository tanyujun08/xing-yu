        },
        "revoked_qty": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "expired_qty": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "as_of_at": {
          "type": "string",
          "format": "date-time"
        },
        "next_expiry_at": {
          "type": [
            "string",
            "null"
          ],
          "format": "date-time"
        },
        "expiry_pending": {
          "type": "boolean"
        }
      }
    },
    "MemberPointEntry": {
      "type": "object",
