          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "point_kind": {
          "type": "string"
        },
        "account_sequence": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        },
        "action": {
          "type": "string"
        },
        "available_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "reserved_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "earned_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "available_after": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "reserved_after": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "source_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "rule_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "original_spend_entry_id": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1,
          "maxLength": 64
        },
        "reversal_of": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1,
          "maxLength": 64
        },
        "reason_code": {
          "type": "string"
        },
        "occurred_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "MemberEntitlementMovement": {
      "type": "object",
      "additionalProperties": false,
