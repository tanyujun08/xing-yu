{
  "Schemas": {
    "MemberSummary": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "account_id",
        "user_no",
        "display_name",
        "rental_status",
        "level_code",
        "total_growth_units",
        "available_pink_units",
        "first_registered_at",
        "version"
      ],
      "properties": {
        "account_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "user_no": {
          "type": "string"
        },
        "display_name": {
          "type": "string"
        },
        "rental_status": {
          "type": "string"
        },
        "level_code": {
          "type": [
            "string",
            "null"
          ]
        },
        "total_growth_units": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        },
        "available_pink_units": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        },
        "first_registered_at": {
          "type": "string",
          "format": "date-time"
        },
        "version": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        }
      }
    },
    "MemberPointAccount": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "point_kind",
        "total_earned_points",
        "available_points",
        "reserved_points",
        "latest_sequence"
      ],
      "properties": {
        "point_kind": {
          "type": "string"
        },
        "total_earned_points": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "available_points": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "reserved_points": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "latest_sequence": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]*)$"
        }
      }
    },
