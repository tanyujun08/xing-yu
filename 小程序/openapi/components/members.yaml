        "action": {
          "type": "string"
        },
        "quantity": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "available_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "reserved_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "consumed_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "granted_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "refund_frozen_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "revoked_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "expired_delta": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "available_before_qty": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "available_after_qty": {
          "type": "string",
          "pattern": "^-?(0|[1-9][0-9]*)$"
        },
        "reversal_of": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1,
          "maxLength": 64
        },
        "reason_code": {
          "type": "string"
        },
        "occurred_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "MemberCheckIn": {
