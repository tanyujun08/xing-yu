ActionDecision:
  type: object
  additionalProperties: false
  required: [action_id, aggregate_version, decision, reason_code, blocking_items]
  properties:
    action_id:
      type: string
    aggregate_version:
      type: string
    decision:
      type: string
      enum:
        - ACCEPTED
        - IDEMPOTENT_REPLAY
        - WAITING
        - REJECTED
        - REVIEW_REQUIRED
        - RECONCILING
        - COMPENSATING
        - STALE_NOOP
    reason_code:
      type: string
    blocking_items:
      type: array
      items:
        $ref: "#/BlockingItem"
    retry_after:
      type: string
      format: date-time
    deadline:
      type: string
      format: date-time

BlockingItem:
  type: object
  additionalProperties: false
  required: [code, message]
  properties:
    code:
      type: string
    message:
      type: string
    subject_type:
      type: string
    subject_id:
      type: string

