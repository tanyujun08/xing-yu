ID:
  $ref: ./rental-orders.yaml#/ID
Version:
  $ref: ./rental-orders.yaml#/Version
Sequence:
  type: string
  pattern: ^(0|[1-9][0-9]{0,19})$
Hash:
  type: string
  pattern: ^[a-f0-9]{64}$
Time:
  $ref: ./rental-orders.yaml#/Time
URL:
  type: string
  format: uri
  pattern: ^https://
  maxLength: 2048
Intent:
  type: string
  minLength: 16
  maxLength: 64
  pattern: ^[!-~]+$
SignatureAttempt:
  type: object
  additionalProperties: false
  required: [attempt_id, client_signature_id, status, version, preview_artifact_id, preview_sha256, error_code, allowed_actions, expires_at, confirmed_at]
  properties:
    attempt_id: { $ref: '#/ID' }
    client_signature_id: { $ref: '#/Intent' }
    status:
      type: string
      enum: [BUILDING, PREVIEW_READY, RENDER_FAILED, CONFIRMED, SUPERSEDED, EXPIRED]
    version: { $ref: '#/Version' }
    preview_artifact_id:
      anyOf: [{ $ref: '#/ID' }, { type: 'null' }]
    preview_sha256:
      anyOf: [{ $ref: '#/Hash' }, { type: 'null' }]
    error_code:
      anyOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: 'null' }]
    allowed_actions:
      type: array
      maxItems: 8
      items: { $ref: ./rental-orders.yaml#/Action }
    expires_at: { $ref: '#/Time' }
    confirmed_at:
      anyOf: [{ $ref: '#/Time' }, { type: 'null' }]
SignatureAttemptLookup:
  type: object
  additionalProperties: false
  required: [state, attempt, signature_image]
  properties:
    state: { type: string, enum: [FOUND, NOT_FOUND] }
    attempt:
      anyOf: [{ $ref: '#/SignatureAttempt' }, { type: 'null' }]
    signature_image:
      anyOf: [{ $ref: '#/SignatureImage' }, { type: 'null' }]
  description: NOT_FOUND only describes this read; retry original create intent with identical input, never create a replacement based on uncertainty.
SignatureImage:
  type: object
  additionalProperties: false
  required: [material_id, sha256, url]
  properties:
    material_id: { $ref: '#/ID' }
    sha256: { $ref: '#/Hash' }
    url: { $ref: '#/URL' }
  description: Original tenant signature for this exact attempt. FOUND reads validate owner, READY, purpose, frozen hash and pinned object before projecting the permanent OSS URL; NOT_FOUND emits null. Only the tenant can query an attempt.
SignatureCreate:
  type: object
  additionalProperties: false
  required: [client_signature_id, signature_material_id, agreement_sha256, order_terms_sha256, replaces_attempt_id, replaces_attempt_version]
  properties:
    client_signature_id: { $ref: '#/Intent' }
    signature_material_id: { $ref: '#/ID' }
    agreement_sha256: { $ref: '#/Hash' }
    order_terms_sha256: { $ref: '#/Hash' }
    replaces_attempt_id:
      anyOf: [{ $ref: '#/ID' }, { type: 'null' }]
    replaces_attempt_version:
      anyOf: [{ $ref: '#/Version' }, { type: 'null' }]
  description: Both replacement fields must be null for first create or both supplied for a known attempt CAS. Replay precedes version checks.
SignatureConfirm:
  type: object
  additionalProperties: false
  required: [preview_artifact_id, preview_sha256, accepted]
  properties:
    preview_artifact_id: { $ref: '#/ID' }
    preview_sha256: { $ref: '#/Hash' }
    accepted: { type: boolean, const: true }
ArtifactPage:
  type: object
  additionalProperties: false
  required: [page_no, material_id, sha256, url]
  properties:
    page_no: { type: integer, minimum: 1, maximum: 64 }
    material_id: { $ref: '#/ID' }
    sha256: { $ref: '#/Hash' }
    url: { $ref: '#/URL' }
SignatureAnchor:
  type: object
  additionalProperties: false
  required: [role, page_no, x, y, w, h]
  properties:
    role: { type: string, const: TENANT_MAIN }
    page_no: { type: integer, minimum: 1, maximum: 64 }
    x: { type: number, minimum: 0, maximum: 1 }
    y: { type: number, minimum: 0, maximum: 1 }
    w: { type: number, exclusiveMinimum: 0, maximum: 1 }
    h: { type: number, exclusiveMinimum: 0, maximum: 1 }
ContractArtifact:
  type: object
  additionalProperties: false
  required: [artifact_id, document_material_id, document_sha256, document_url, page_count, pages, anchor_snapshot_json, renderer_version]
  properties:
    artifact_id: { $ref: '#/ID' }
    document_material_id: { $ref: '#/ID' }
    document_sha256: { $ref: '#/Hash' }
    document_url: { $ref: '#/URL' }
    page_count: { type: integer, minimum: 1, maximum: 64 }
    pages:
      type: array
      minItems: 1
      maxItems: 64
      items: { $ref: '#/ArtifactPage' }
    anchor_snapshot_json:
      type: array
      minItems: 1
      maxItems: 1
      items: { $ref: '#/SignatureAnchor' }
    renderer_version: { type: string, minLength: 1, maxLength: 64 }
DocumentTemplate:
  type: object
  additionalProperties: false
  required: [template_version_id, source_docx_sha256]
  properties:
    template_version_id: { $ref: '#/ID' }
    source_docx_sha256: { $ref: '#/Hash' }
LessorSignature:
  type: object
  additionalProperties: false
  required: [name, mode, source, presignature_id, material_id, signed_at]
  properties:
    name: { type: string, minLength: 1, description: Frozen printed lessor name from this contract. }
    mode: { type: string, const: DEFAULT_SIGNED }
    source: { type: string, const: USER_CONFIRMED_LOCAL_DEFAULT }
    presignature_id: { type: 'null' }
    material_id: { type: 'null' }
    signed_at: { type: 'null' }
TenantSignature:
  type: object
  additionalProperties: false
  required: [name, account_id, status, signed_at]
  properties:
    name: { type: string, minLength: 1, description: Frozen tenant real name used in this contract. }
    account_id: { $ref: '#/ID' }
    status: { type: string, enum: [PENDING, SUCCEEDED] }
    signed_at:
      anyOf: [{ $ref: '#/Time' }, { type: 'null' }]
MessageSummary:
  type: object
  additionalProperties: false
  required: [message_id, kind, preview, sender_id, sent_at]
  properties:
    message_id: { $ref: '#/ID' }
    kind: { type: string, enum: [TEXT, IMAGE] }
    preview: { type: string, minLength: 1, maxLength: 500 }
    sender_id: { $ref: '#/ID' }
    sent_at: { $ref: '#/Time' }
OrderConversation:
  type: object
  additionalProperties: false
  required: [conversation_id, context_kind, order_id, viewer_role, peer, order_summary, last_message, last_message_at, read_sequence, unread_count, can_post, blocked_reason, version]
  properties:
    conversation_id: { $ref: '#/ID' }
    context_kind: { type: string, const: ORDER }
    order_id: { $ref: '#/ID' }
    viewer_role: { type: string, enum: [TENANT, LESSOR] }
    peer:
      type: object
      additionalProperties: false
      required: [account_id, display_name, avatar_url, role]
      properties:
        account_id: { $ref: '#/ID' }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        avatar_url:
          anyOf: [{ $ref: '#/URL' }, { type: 'null' }]
        role: { type: string, enum: [TENANT, LESSOR] }
    order_summary:
      type: object
      additionalProperties: false
      required: [order_id, order_no, asset_title, cover_url, display_status_code, rental_start_at, rental_end_at]
      properties:
        order_id: { $ref: '#/ID' }
        order_no: { type: string, minLength: 1, maxLength: 32 }
        asset_title: { type: string, minLength: 1, maxLength: 128 }
        cover_url:
          anyOf: [{ $ref: '#/URL' }, { type: 'null' }]
        display_status_code: { type: string, minLength: 1, maxLength: 64 }
        rental_start_at: { $ref: '#/Time' }
        rental_end_at: { $ref: '#/Time' }
    last_message:
      anyOf: [{ $ref: '#/MessageSummary' }, { type: 'null' }]
    last_message_at:
      anyOf: [{ $ref: '#/Time' }, { type: 'null' }]
    read_sequence: { $ref: '#/Sequence' }
    unread_count: { $ref: '#/Sequence' }
    can_post: { type: boolean }
    blocked_reason:
      anyOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: 'null' }]
    version: { $ref: '#/Version' }
OrderConversationPage:
  type: object
  additionalProperties: false
  required: [items, next_cursor, has_more, total_unread_count, as_of_at]
  properties:
    items: { type: array, maxItems: 50, items: { $ref: '#/OrderConversation' } }
    next_cursor:
      anyOf: [{ type: string, minLength: 1, maxLength: 4096 }, { type: 'null' }]
    has_more: { type: boolean }
    total_unread_count: { $ref: '#/Sequence' }
    as_of_at: { $ref: '#/Time' }
OrderMessage:
  type: object
  additionalProperties: false
  required: [message_id, sequence, client_message_id, sender_id, kind, body, media, sent_at]
  properties:
    message_id: { $ref: '#/ID' }
    sequence: { $ref: '#/Version' }
    client_message_id: { $ref: '#/Intent' }
    sender_id: { $ref: '#/ID' }
    kind: { type: string, enum: [TEXT, IMAGE] }
    body:
      anyOf: [{ type: string, minLength: 1, maxLength: 500, pattern: '\S' }, { type: 'null' }]
    media:
      anyOf:
        - type: object
          additionalProperties: false
          required: [material_id, url, mime_type, width, height]
          properties:
            material_id: { $ref: '#/ID' }
            url: { $ref: '#/URL' }
            mime_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
            width: { type: integer, minimum: 1, maximum: 16384 }
            height: { type: integer, minimum: 1, maximum: 16384 }
        - type: 'null'
    sent_at: { $ref: '#/Time' }
OrderMessageCreate:
  type: object
  additionalProperties: false
  required: [client_message_id, kind, body, material_id]
  properties:
    client_message_id: { $ref: '#/Intent' }
    kind: { type: string, enum: [TEXT, IMAGE] }
    body:
      anyOf: [{ type: string, minLength: 1, maxLength: 500, pattern: '\S' }, { type: 'null' }]
    material_id:
      anyOf: [{ $ref: '#/ID' }, { type: 'null' }]
  description: TEXT requires nonblank body and null material_id; IMAGE requires null body and one owned READY image material.
OrderMessageLookup:
  type: object
  additionalProperties: false
  required: [state, message]
  properties:
    state: { type: string, enum: [APPLIED, NOT_FOUND] }
    message:
      anyOf: [{ $ref: '#/OrderMessage' }, { type: 'null' }]
OrderMessagePage:
  type: object
  additionalProperties: false
  required: [conversation, items, has_more, next_before_sequence, next_after_sequence, last_sequence]
  properties:
    conversation: { $ref: '#/OrderConversation' }
    items: { type: array, maxItems: 50, items: { $ref: '#/OrderMessage' } }
    has_more: { type: boolean }
    next_before_sequence:
      anyOf: [{ $ref: '#/Sequence' }, { type: 'null' }]
    next_after_sequence:
      anyOf: [{ $ref: '#/Sequence' }, { type: 'null' }]
    last_sequence: { $ref: '#/Sequence' }
OrderReadCursorRequest:
  type: object
  additionalProperties: false
  required: [through_sequence]
  properties:
    through_sequence: { $ref: '#/Sequence' }
OrderReadCursor:
  type: object
  additionalProperties: false
  required: [read_sequence, unread_count]
  properties:
    read_sequence: { $ref: '#/Sequence' }
    unread_count: { $ref: '#/Sequence' }
