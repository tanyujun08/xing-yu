{
  "Schemas": {
    "OpsCabinetCredential": {
      "type": "object",
      "additionalProperties": false,
      "required": ["credential_id", "kind", "cabinet_id", "compartment_id", "placement_id", "status", "generated_at", "activated_at", "consumed_at", "revoked_at", "updated_at", "version"],
      "properties": {
        "credential_id": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[!-~]{1,64}$" },
        "kind": { "type": "string", "enum": ["PICKUP"] },
        "cabinet_id": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[!-~]{1,64}$" },
        "compartment_id": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[!-~]{1,64}$" },
        "placement_id": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[!-~]{1,64}$" },
        "status": { "type": "string", "enum": ["DORMANT", "ACTIVE", "CONSUMED", "REVOKED"] },
        "generated_at": { "type": "string", "format": "date-time", "pattern": "Z$" },
        "activated_at": {
          "anyOf": [
            { "type": "string", "format": "date-time", "pattern": "Z$" },
            { "type": "null" }
          ]
        },
        "consumed_at": {
          "anyOf": [
            { "type": "string", "format": "date-time", "pattern": "Z$" },
            { "type": "null" }
          ]
        },
        "revoked_at": {
          "anyOf": [
            { "type": "string", "format": "date-time", "pattern": "Z$" },
            { "type": "null" }
          ]
        },
        "updated_at": { "type": "string", "format": "date-time", "pattern": "Z$" },
        "version": { "type": "string", "pattern": "^[1-9][0-9]{0,19}$" }
      }
    },
    "OpsCabinetCredentialReplaceRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": ["reason"],
      "properties": {
        "reason": { "type": "string", "minLength": 1, "maxLength": 500 }
      }
    },
    "OpsCabinetCredentialReplaceReceipt": {
      "type": "object",
      "additionalProperties": false,
      "required": ["previous", "replacement", "event_id", "occurred_at", "replayed"],
      "properties": {
        "previous": { "$ref": "#/Schemas/OpsCabinetCredential" },
        "replacement": { "$ref": "#/Schemas/OpsCabinetCredential" },
        "event_id": { "type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[!-~]{1,64}$" },
        "occurred_at": { "type": "string", "format": "date-time", "pattern": "Z$" },
        "replayed": { "type": "boolean" }
      }
    }
  }
}
