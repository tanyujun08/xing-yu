{
  "Schemas": {
    "PhoneVerification": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "challenge_id",
        "status",
        "expires_at"
      ],
      "properties": {
        "challenge_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "status": {
          "type": "string",
          "minLength": 1,
          "maxLength": 32
        },
        "expires_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        }
      }
    },
    "OpsIAMAccount": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "account_id",
        "status",
        "security_version",
        "display_name",
        "roles",
        "scopes",
        "created_at",
        "updated_at"
      ],
      "properties": {
        "account_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "status": {
          "type": "string",
          "enum": [
            "ACTIVE",
            "DISABLED",
            "ARCHIVED"
          ]
        },
        "security_version": {
          "type": "integer",
          "minimum": 1
        },
        "display_name": {
          "type": "string",
          "maxLength": 64
        },
        "roles": {
          "type": "array",
          "items": {
            "type": "string"
          }
        },
        "scopes": {
          "type": "array",
          "items": {
            "$ref": "./iam.yaml#/ScopeGrant"
          }
        },
        "created_at": {
          "type": "string",
          "format": "date-time"
        },
        "updated_at": {
          "type": "string",
          "format": "date-time"
        },
        "phone_verification": {
          "$ref": "#/Schemas/PhoneVerification"
        },
        "phone_masked": {
          "pattern": "^1[0-9]{2}\\*{4}[0-9]{4}$",
          "type": [
            "string",
            "null"
          ]
        },
        "last_login_at": {
          "format": "date-time",
          "type": [
            "string",
            "null"
          ]
        },
        "archived_at": {
          "format": "date-time",
          "type": [
            "string",
            "null"
          ]
        },
        "archived_by": {
          "maxLength": 64,
          "type": [
            "string",
            "null"
          ]
        },
        "wechat_binding": {
          "$ref": "./iam.yaml#/OpsWechatBinding"
        }
      }
    },
    "CreateOpsIAMAccountRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "display_name",
        "phone",
        "role_ids",
        "scopes",
        "reason"
      ],
      "properties": {
        "display_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "phone": {
          "type": "string",
          "minLength": 1,
          "maxLength": 32
        },
        "role_ids": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "pattern": "^[!-~]{1,64}$"
          },
          "minItems": 1,
          "maxItems": 1
        },
        "scopes": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "$ref": "./iam.yaml#/ScopeGrant"
          }
        },
        "reason": {
          "type": "string",
          "minLength": 3,
          "maxLength": 256
        },
        "status": {
          "enum": [
            "ACTIVE",
            "DISABLED"
          ],
          "type": "string",
          "default": "ACTIVE"
        }
      }
    },
    "ChangeOpsIAMAccountStatusRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "reason"
      ],
      "properties": {
        "reason": {
          "type": "string",
          "minLength": 3,
          "maxLength": 256
        }
      }
    },
    "UpdateOpsIAMAccountRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "reason"
      ],
      "properties": {
        "display_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        },
        "phone": {
          "type": "string",
          "minLength": 1,
          "maxLength": 32
        },
        "reason": {
          "type": "string",
          "minLength": 3,
          "maxLength": 256
        },
        "role_ids": {
          "maxItems": 1,
          "minItems": 1,
          "items": {
            "minLength": 1,
            "type": "string",
            "maxLength": 64
          },
          "type": "array",
          "uniqueItems": true
        }
      }
    },
    "WechatSubscriptionObservationRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "scene",
        "template_id",
        "client_result",
        "observed_at"
      ],
      "properties": {
        "scene": {
          "type": "string",
          "pattern": "^[!-~]{1,64}$"
        },
        "template_id": {
          "type": "string",
          "pattern": "^[!-~]{1,128}$"
        },
        "client_result": {
          "type": "string",
          "enum": [
            "ACCEPT",
            "REJECT",
            "BAN"
          ]
        },
        "observed_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "WechatSubscriptionObservation": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "subscription_id",
        "scene",
        "template_id",
        "client_result",
        "observed_at",
        "status",
        "version",
        "created_at"
      ],
      "properties": {
        "subscription_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "scene": {
          "type": "string",
          "pattern": "^[!-~]{1,64}$"
        },
        "template_id": {
          "type": "string",
          "pattern": "^[!-~]{1,128}$"
        },
        "client_result": {
          "type": "string",
          "enum": [
            "ACCEPT",
            "REJECT",
            "BAN"
          ]
        },
        "observed_at": {
          "type": "string",
          "format": "date-time"
        },
        "status": {
          "type": "string",
          "enum": [
            "OBSERVED"
          ]
        },
        "version": {
          "type": "integer",
          "minimum": 1
        },
        "created_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    }
  }
}
