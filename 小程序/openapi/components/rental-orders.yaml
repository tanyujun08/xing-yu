        - type: 'null'
  description: >-
    历史版本只读；allocation由该版本overtime_assessed_fen、loss_confirmed_fen及不变deposit_received_fen计算，过程审核未定费用为null且deducted=0。不混入当前退款成功状态；当前账单由B08/B12读。
OpsReviewPage:
  type: object
  additionalProperties: false
  required:
    - items
    - next_cursor
    - has_more
  properties:
    items:
      type: array
      items:
        $ref: '#/OpsReviewView'
      maxItems: 100
      minItems: 0
    next_cursor:
      anyOf:
        - $ref: '#/Token'
        - type: 'null'
    has_more:
      type: boolean
MiniLookupRequest:
  type: object
  additionalProperties: false
  required:
    - operation_id
    - target_id
    - idempotency_key
  properties:
    operation_id:
      type: string
      enum:
        - B02
        - K10
    target_id:
      type: 'null'
    idempotency_key:
      type: string
      minLength: 16
      maxLength: 64
      pattern: ^[!-~]+$
  description: 只读查询固定候选操作的原意图结果；不是命令分派器。作用域绑定当前主体、原操作、原目标与原键，重新检查原权限。
ContractConsentRequest:
  type: object
  additionalProperties: false
  required:
    - accepted
    - agreement_sha256
    - order_terms_sha256
  properties:
    accepted:
      type: boolean
      const: true
    agreement_sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    order_terms_sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
ReturnEvidenceExample:
  type: object
  additionalProperties: false
  required:
    - object_key
    - sha256
    - mime_type
    - poster_object_key
    - url
    - poster_url
  properties:
    object_key:
      type: string
      maxLength: 512
    sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    mime_type:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
        - video/mp4
    poster_object_key:
      anyOf:
        - type: string
          maxLength: 512
        - type: 'null'
    url:
      type: string
      maxLength: 2048
    poster_url:
      anyOf:
        - type: string
          maxLength: 2048
        - type: 'null'
ReturnEvidenceSlot:
  type: object
  additionalProperties: false
  required:
    - slot_key
    - title
    - kind
    - stage
    - min_count
    - max_count
    - instruction
    - sort_order
    - example
  properties:
    slot_key:
      type: string
      pattern: ^[a-z][a-z0-9-]{0,63}$
    title:
      type: string
      maxLength: 80
    kind:
      type: string
      enum:
        - PHOTO
        - VIDEO
    stage:
      type: string
      enum:
        - PRE_RETURN
        - AFTER_OPEN
    min_count:
      type: integer
      minimum: 1
      maximum: 20
    max_count:
      type: integer
      minimum: 1
      maximum: 20
    instruction:
      type: string
      maxLength: 2000
    sort_order:
      type: integer
      minimum: 0
      maximum: 1000
    example:
      anyOf:
        - $ref: '#/ReturnEvidenceExample'
        - type: 'null'
ReturnEvidenceTemplate:
  type: object
  additionalProperties: false
  required:
    - template_key
    - version
    - title
    - slots
  properties:
    template_key:
      type: string
      maxLength: 64
    version:
      type: string
      maxLength: 64
    title:
      type: string
      maxLength: 80
    slots:
      type: array
      items:
        $ref: '#/ReturnEvidenceSlot'
      minItems: 1
      maxItems: 20
ReturnEvidenceItem:
  type: object
  additionalProperties: false
  required:
    - evidence_id
    - slot_key
    - item_no
    - revision_no
    - binding_version
    - material_id
    - kind
    - stage
    - is_current
    - replaces_evidence_id
    - source
    - submitted_by
    - reason
    - created_at
    - availability
    - media
  properties:
    evidence_id:
      $ref: '#/ID'
    slot_key:
      type: string
      maxLength: 64
    item_no:
      type: integer
      minimum: 1
      maximum: 20
    revision_no:
      type: integer
      minimum: 1
      maximum: 200
    binding_version:
      type: string
      pattern: ^[1-9][0-9]*$
    material_id:
      $ref: '#/ID'
    kind:
      type: string
      enum:
        - PHOTO
        - VIDEO
    stage:
      type: string
      enum:
        - PRE_RETURN
        - AFTER_OPEN
    is_current:
      type: boolean
    replaces_evidence_id:
      anyOf:
        - $ref: '#/ID'
        - type: 'null'
    source:
      type: string
      enum:
        - TENANT
        - OPS_SUPPLEMENT
    submitted_by:
      $ref: '#/ID'
    reason:
      anyOf:
        - type: string
          maxLength: 500
        - type: 'null'
    created_at:
      $ref: '#/Time'
    availability:
      type: string
      enum:
        - READY
        - UNAVAILABLE
    media:
      anyOf:
        - $ref: '#/PublicMaterialMedia'
        - type: 'null'
ReturnEvidenceSlotView:
  type: object
  additionalProperties: false
  required:
    - slot
    - items
    - complete
    - editable
    - blocker
  properties:
    slot:
      $ref: '#/ReturnEvidenceSlot'
    items:
      type: array
      items:
        $ref: '#/ReturnEvidenceItem'
      minItems: 0
      maxItems: 20
    complete:
      type: boolean
    editable:
      type: boolean
    blocker:
      anyOf:
        - type: string
          maxLength: 128
        - type: 'null'
ReturnEvidenceItemRequest:
  type: object
  additionalProperties: false
  required:
    - material_id
    - reason
  properties:
    material_id:
      $ref: '#/ID'
    reason:
      anyOf:
        - $ref: '#/Reason'
        - type: 'null'
ReturnMissingItem:
  type: object
  additionalProperties: false
  required:
    - slot_key
    - item_no
    - evidence_id
    - reason
  properties:
    slot_key:
      type: string
      maxLength: 64
    item_no:
      type: integer
      minimum: 1
      maximum: 20
    evidence_id:
      anyOf:
        - $ref: '#/ID'
        - type: 'null'
    reason:
      $ref: '#/Reason'
ReturnResolutionRequest:
  type: object
  additionalProperties: false
  required:
    - action
    - reason
  properties:
    action:
      type: string
      enum:
        - RECHECK
        - RELEASE_EMPTY
    reason:
      $ref: '#/Reason'
SupplementView:
  type: object
  additionalProperties: false
  required: [supplement_id, order_id, final_review_id, amount_fen, currency, status, active_payment, paid_payment, paid_at, version]
  properties:
    supplement_id:
      $ref: '#/ID'
    order_id:
      $ref: '#/ID'
    final_review_id:
      $ref: '#/ID'
    amount_fen:
      $ref: '#/PositiveFen'
    currency:
      type: string
      const: CNY
    status:
      type: string
      enum: [UNPAID, PAID]
    active_payment:
      anyOf:
        - $ref: '#/PaymentView'
        - type: 'null'
    paid_payment:
      anyOf:
        - $ref: '#/PaymentView'
        - type: 'null'
    paid_at:
      anyOf:
        - $ref: '#/Time'
        - type: 'null'
    version:
      $ref: '#/Version'
  description: 不自动超时的业务欠款。active_payment为当前待确认渠道交易，paid_payment为唯一清偿来源；迟到重复款另记误收责任。
RefundSummary:
