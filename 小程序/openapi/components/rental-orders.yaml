ReviewPreviewRequest:
  type: object
  additionalProperties: false
  required:
    - decision
    - receipt_version
    - overtime_assessed_fen
    - adjustment_reason
    - loss_items
    - rejection_reason
    - missing_items
    - evidence_ids
  properties:
    decision:
      type: string
      enum:
        - APPROVE_FINAL
        - REVIEW_PENDING
        - MATERIAL_REQUIRED
    receipt_version:
      anyOf:
        - $ref: '#/Version'
        - type: 'null'
    overtime_assessed_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
    adjustment_reason:
      anyOf:
        - $ref: '#/Reason'
        - type: 'null'
    loss_items:
      type: array
      items:
        $ref: '#/LossItem'
      maxItems: 100
      minItems: 0
    rejection_reason:
      anyOf:
        - $ref: '#/Reason'
        - type: 'null'
    missing_items:
      type: array
      items:
        $ref: '#/ReturnMissingItem'
      minItems: 0
      maxItems: 20
    evidence_ids:
      type: array
      items:
        $ref: '#/ID'
      maxItems: 20
      minItems: 0
      uniqueItems: true
  allOf:
    - if:
        properties:
          decision:
            const: APPROVE_FINAL
      then:
        properties:
          receipt_version:
            $ref: '#/Version'
          overtime_assessed_fen:
            $ref: '#/Fen'
          rejection_reason:
            type: 'null'
          missing_items:
            maxItems: 0
          loss_items:
            items:
              allOf:
                - $ref: '#/LossItem'
                - properties:
                    confirmed_fen:
                      $ref: '#/Fen'
      else:
        properties:
          rejection_reason:
            $ref: '#/Reason'
    - if:
        properties:
          decision:
            const: MATERIAL_REQUIRED
      then:
        properties:
          missing_items:
            minItems: 1
          receipt_version:
            $ref: '#/Version'
  description: >-
    同一审核正文。APPROVE_FINAL含官方对本版COMPLETE材料合格的确认，仍须服务端完整性检查；过程不要求FINAL预览成功。有RETURN必传其最新version；无RETURN仅REVIEW_PENDING可传null。
