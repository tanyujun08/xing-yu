        - type: 'null'
    payer_refund_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
    payer_net_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
    excess_received_fen:
      $ref: '#/Fen'
    currency:
      type: string
      const: CNY
PaymentHistoryPage:
  type: object
