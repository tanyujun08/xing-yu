    lessor_account_id:
      anyOf:
        - $ref: '#/ID'
        - type: 'null'
    lessor_display_name:
      anyOf:
        - type: string
          maxLength: 256
        - type: 'null'
    merchant_id:
      anyOf:
        - $ref: '#/ID'
        - type: 'null'
    merchant_name:
      anyOf:
        - type: string
          maxLength: 256
        - type: 'null'
  description: 仅后台订单读权限；参与方ID随订单冻结，名称为当前授权展示名，缺失显示ID。不给出证件、OpenID或完整手机号。
OpsOrderSummary:
  type: object
  additionalProperties: false
  required:
    - payment_mode
    - order_id
    - order_no
    - viewer_role
    - supply_channel
    - stage
    - physical_status
    - review_status
    - display_status
    - has_exception
    - exception_codes
    - asset
    - rental_start_at
    - rental_end_at
    - placed_at
    - created_at
    - version
    - allowed_actions
    - blockers
    - display_status_code
    - initial_due_fen
    - initial_paid_fen
    - initial_payer_total_fen
    - supplement_due_fen
    - payment_due_at
    - participants
  properties:
    payment_mode:
      type: string
      enum: [NORMAL, FIXED_10_FEN]
      description: FIXED_10_FEN 为测试订单，业务押金覆盖不代表渠道实收，不产生正常收益。
    order_id:
      $ref: '#/ID'
    order_no:
      type: string
      minLength: 1
      maxLength: 32
    viewer_role:
      type: string
      enum:
        - TENANT
        - LESSOR
        - OFFICIAL
    supply_channel:
      type: string
      enum:
        - PERSONAL
        - OFFICIAL_CABINET
    stage:
      $ref: '#/Stage'
    physical_status:
      $ref: '#/Physical'
    review_status:
      $ref: '#/ReviewStatus'
    display_status:
      type: string
      minLength: 1
      maxLength: 64
    has_exception:
      type: boolean
    exception_codes:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
      maxItems: 30
      minItems: 0
    asset:
      $ref: '#/AssetSummary'
    rental_start_at:
      $ref: '#/Time'
    rental_end_at:
      $ref: '#/Time'
    placed_at:
      anyOf:
        - $ref: '#/Time'
        - type: 'null'
    created_at:
      $ref: '#/Time'
    version:
      $ref: '#/Version'
    allowed_actions:
      type: array
      items:
        $ref: '#/Action'
      maxItems: 30
      minItems: 0
    blockers:
      type: array
      items:
        $ref: '#/Blocker'
      maxItems: 30
      minItems: 0
    display_status_code:
      type: string
      enum:
        - PREPARING
        - AWAITING_CONFIRMATION
        - AWAITING_PAYMENT
        - AWAITING_DELIVERY
        - IN_USE
        - RETURNING
        - RETURN_REVIEW
        - AWAITING_SUPPLEMENT
        - REFUND_PROCESSING
        - SETTLEMENT_CONFIRMING
        - COMPLETED
        - CLOSED
    initial_due_fen:
      $ref: '#/Fen'
    initial_paid_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
      description: INITIAL可信SUCCEEDED取amount_fen（订单结清额，含渠道优惠），零现金确认取0；尚未确认取null；不把补缴混入卡片初始实付，不把UNKNOWN写0。
    supplement_due_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
      description: 实物收回且FINAL后由最终核定与本单可信补缴支付计算；成功补缴后为0，尚未核定为null，不使用初付金额替代。
    payment_due_at:
      anyOf:
        - $ref: '#/Time'
        - type: 'null'
    initial_payer_total_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
      description: INITIAL成功的payer_total_fen，展示用户微信实付；成功但渠道未返回时为null并显示已支付/金额待核实，不能拿amount_fen冒充微信实付；零现金确认取0。
    participants:
      $ref: '#/OpsOrderParticipants'
