    cabinet_id:
      $ref: '#/ID'
    name:
      type: string
      maxLength: 128
    address:
      type:
        - string
        - 'null'
      maxLength: 512
    connectivity_status:
      type: string
      enum:
        - ONLINE
        - OFFLINE
        - UNKNOWN
    pickup_enabled:
      type: boolean
      description: 柜机公共可服务状态，不能代替K10/K04的本人权限与实时校验
    login_required:
      type: boolean
      const: true
CabinetPickupResolveRequest:
  type: object
  additionalProperties: false
  required:
    - scene
    - pickup_code
  properties:
    scene:
      $ref: '#/CabinetScene'
    pickup_code:
      type: string
      pattern: ^[0-9]{6}$
      minLength: 6
      maxLength: 6
      writeOnly: true
      description: 用户手动输入，保留前导0；F20不从K07取得正确码
AddressVersion:
  type: string
  pattern: ^(0|[1-9][0-9]{0,9})$
  description: INT UNSIGNED十进制字符串，服务端BigInt校验0..4294967295；0表示尚无返程地址。
  x-integer-maximum: '4294967295'
PositiveAddressVersion:
  type: string
  pattern: ^[1-9][0-9]{0,9}$
  description: INT UNSIGNED十进制字符串1..4294967295；必须等于本次回显的地址版本。
  x-integer-maximum: '4294967295'
ByteCount:
  type: string
  pattern: ^[1-9][0-9]{0,18}$
  description: 正整数字节数；服务端校验<=9223372036854775807及素材系统限制；不是金额。
PickupContext:
  type: object
  additionalProperties: false
  required:
    - cabinet_id
    - name
    - address
    - compartment_id
    - compartment_no
    - connectivity_status
  properties:
    cabinet_id:
      $ref: '#/ID'
    name:
      type: string
      maxLength: 128
    address:
      anyOf:
        - type: string
          maxLength: 512
        - type: 'null'
    compartment_id:
      $ref: '#/ID'
    compartment_no:
      type: integer
      minimum: 1
      maximum: 48
    connectivity_status:
      type: string
      enum:
        - ONLINE
        - OFFLINE
        - UNKNOWN
CheckoutSelection:
  type: object
  additionalProperties: false
  required:
    - coupon_id
  properties:
    coupon_id:
      anyOf:
        - $ref: '#/ID'
        - type: 'null'
  description: 冻结唯一coupon_id，押金默认现金，免押仅来自合法免押券；无其他待接入方案字段。
DeliveryConfirmationRequest:
  type: object
  additionalProperties: false
  required: []
  properties: {}
  description: 已有确认收货弹层只提交{}。仅本单承租人在个人快递已发货且实际收到后操作；服务端记录首次确认时间为occurred_at、recorded_at及delivered_at，重复请求不改时间；不新增时间或附件输入。
Quantity:
  type: string
  pattern: ^(0|[1-9][0-9]{0,18})$
  description: 权益整数数量，不是金额；服务端限制到int64及真实可用量。
PublicMaterialMedia:
  type: object
  additionalProperties: false
  required:
    - material_id
    - role
    - sort_order
    - url
    - mime_type
    - size_bytes
    - metadata
    - poster
  properties:
    material_id:
      $ref: ./common.yaml#/OpaqueID
    role:
      type: string
      enum:
        - COVER
        - IMAGE
        - VIDEO
    sort_order:
      type: integer
      minimum: 0
      maximum: 65535
    url:
      $ref: '#/PublicMaterialURL'
    mime_type:
      type: string
      minLength: 3
      maxLength: 64
    size_bytes:
      type: integer
      minimum: 1
      maximum: 104857600
    metadata:
      anyOf:
        - $ref: '#/MediaMetadataV1'
        - type: 'null'
    poster:
      anyOf:
        - $ref: '#/MaterialPoster'
        - type: 'null'
PublicMaterialURL:
  type: string
  format: uri
  pattern: ^https://xyuprj\.oss-cn-hangzhou\.aliyuncs\.com/[A-Za-z0-9._~/%-]+$
  description: Permanent anonymous HTTPS URL in the original bucket; no signature, query, fragment or userinfo.
MediaMetadataV1:
  type: object
  additionalProperties: false
  required:
    - schema_version
    - width
    - height
    - duration_ms
    - video_codec
    - audio_codec
  properties:
    schema_version:
      type: integer
      const: 1
    width:
      type: integer
      minimum: 1
      maximum: 8192
    height:
      type: integer
      minimum: 1
      maximum: 8192
    duration_ms:
      type:
        - integer
        - 'null'
      minimum: 1
      maximum: 4294967295
    video_codec:
      type:
        - string
        - 'null'
      pattern: ^[a-z0-9_]{1,32}$
    audio_codec:
      type:
        - string
        - 'null'
      pattern: ^[a-z0-9_]{1,32}$
MaterialPoster:
  type: object
  additionalProperties: false
  required:
    - material_id
    - url
    - width
    - height
  properties:
    material_id:
      $ref: ./common.yaml#/OpaqueID
    url:
      $ref: '#/PublicMaterialURL'
    width:
      type: integer
      minimum: 1
      maximum: 1280
    height:
      type: integer
      minimum: 1
      maximum: 1280
OrderMediaView:
  type: object
  additionalProperties: false
  required:
    - material_id
    - kind
    - availability
    - media
  properties:
    material_id:
      $ref: '#/ID'
    kind:
      type: string
      enum:
        - PHOTO
        - VIDEO
    availability:
      type: string
      enum:
        - READY
        - UNAVAILABLE
    media:
      anyOf:
        - $ref: '#/PublicMaterialMedia'
        - type: 'null'
  description: >-
    按订单读取权限返回永久公开媒体投影，VIDEO的media.url为可信playback_url，poster为该视频自身派生。UNAVAILABLE返回media=null，不伪造空成功；不返回owner/object_key或管理元数据。输入仍只接受素材ID和kind。
  allOf:
    - if:
        properties:
          availability:
            const: READY
      then:
        properties:
          media:
            $ref: '#/PublicMaterialMedia'
      else:
        properties:
          media:
            type: 'null'
LossItemView:
  type: object
  additionalProperties: false
  required:
    - description
    - confirmed_fen
    - evidence_ids
    - evidence
  properties:
    description:
      $ref: '#/Reason'
    confirmed_fen:
      anyOf:
        - $ref: '#/Fen'
        - type: 'null'
    evidence_ids:
      type: array
      items:
        $ref: '#/ID'
      maxItems: 20
      minItems: 0
      uniqueItems: true
    evidence:
      type: array
      items:
        $ref: '#/OrderMediaView'
      maxItems: 20
  description: 损失项仅包含说明、官方核定金额及凭证；过程未核定为null。数组顺序标识展示行，不设主张/争议金额或业务行ID。
  allOf:
    - if:
        properties:
          confirmed_fen:
            $ref: '#/PositiveFen'
      then:
        properties:
          evidence_ids:
            minItems: 1
OpsOrderParticipants:
  type: object
  additionalProperties: false
  required:
    - tenant_account_id
