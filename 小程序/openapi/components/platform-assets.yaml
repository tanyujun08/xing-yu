{
  "Schemas": {
    "OpsPlatformAssetTerms": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "product_id",
        "display_name",
        "condition",
        "defect_description",
        "accessories_text",
        "description",
        "rental_unit",
        "unit_price_fen",
        "deposit_fen",
        "minimum_units",
        "reference_value_fen",
        "available_from",
        "available_until",
        "timezone",
        "media",
        "delivery_options",
        "rule_version_id",
        "eligibility_rule_version_id"
      ],
      "properties": {
        "product_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "display_name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "condition": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "description": "Operator-entered physical condition text; preserved and returned verbatim after whitespace normalization."
        },
        "defect_description": {
          "type": "string",
          "minLength": 0,
          "maxLength": 2000
        },
        "accessories_text": {
          "type": "string",
          "minLength": 0,
          "maxLength": 2000
        },
        "description": {
          "type": "string",
          "minLength": 0,
          "maxLength": 4000
        },
        "rental_unit": {
          "type": "string",
          "enum": [
            "HOUR",
            "DAY"
          ]
        },
        "unit_price_fen": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,18}$"
        },
        "deposit_fen": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "minimum_units": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,18}$"
        },
        "reference_value_fen": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "available_from": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        },
        "available_until": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        },
        "timezone": {
          "type": "string",
          "const": "Asia/Shanghai"
        },
        "publication_location": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "dataset_id",
            "province_id",
            "city_id",
            "district_id",
            "detail_address",
            "recipient_name",
            "phone_country_code",
            "phone",
            "location"
          ],
          "properties": {
            "dataset_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            "province_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            "city_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            "district_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            "detail_address": {
              "type": "string",
              "minLength": 1,
              "maxLength": 500
            },
            "recipient_name": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            "phone_country_code": {
              "type": "string",
              "const": "+86"
            },
            "phone": {
              "type": "string",
              "pattern": "^1[3-9][0-9]{9}$"
            },
            "location": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "latitude",
                "longitude",
                "coordinate_system",
                "source"
              ],
              "properties": {
                "latitude": {
                  "type": "string",
                  "pattern": "^-?(?:(?:[0-9]|[1-8][0-9])\\.[0-9]{6}|90\\.000000)$"
                },
                "longitude": {
                  "type": "string",
                  "pattern": "^-?(?:(?:[0-9]|[1-9][0-9]|1[0-7][0-9])\\.[0-9]{6}|180\\.000000)$"
                },
                "coordinate_system": {
                  "const": "GCJ02",
                  "type": "string"
                },
                "source": {
                  "const": "MAP_PICK",
                  "type": "string"
                }
              }
            }
          }
        },
        "media": {
          "type": "array",
          "maxItems": 20,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "material_id",
              "role",
              "sort_order"
            ],
            "properties": {
              "material_id": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[!-~]{1,64}$"
              },
              "role": {
                "type": "string",
                "enum": [
                  "COVER",
                  "IMAGE",
                  "VIDEO",
                  "OWNERSHIP",
                  "DEFECT"
                ]
              },
              "sort_order": {
                "type": "integer",
                "minimum": 0,
                "maximum": 99
              }
            }
          },
          "minItems": 1,
          "contains": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "material_id",
              "role",
              "sort_order"
            ],
            "properties": {
              "material_id": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[!-~]{1,64}$"
              },
              "role": {
                "type": "string",
                "const": "COVER"
              },
              "sort_order": {
                "type": "integer",
                "minimum": 0,
                "maximum": 99
              }
            }
          },
          "minContains": 1,
          "maxContains": 1
        },
        "delivery_options": {
          "type": "array",
          "maxItems": 3,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "method",
              "outbound_fee_payer",
              "return_fee_payer"
            ],
            "properties": {
              "method": {
                "type": "string",
                "enum": [
                  "EXPRESS",
                  "RUNNER",
                  "MEET"
                ]
              },
              "outbound_fee_payer": {
                "type": "string",
                "enum": [
                  "TENANT",
                  "LESSOR"
                ]
              },
              "return_fee_payer": {
                "type": "string",
                "enum": [
                  "TENANT",
                  "LESSOR"
                ]
              },
              "source_address_id": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[!-~]{1,64}$"
              },
              "meeting_location": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "latitude",
                  "longitude",
                  "coordinate_system",
                  "source"
                ],
                "properties": {
                  "latitude": {
                    "type": "string",
                    "pattern": "^-?(?:(?:[0-9]|[1-8][0-9])\\.[0-9]{6}|90\\.000000)$"
                  },
                  "longitude": {
                    "type": "string",
                    "pattern": "^-?(?:(?:[0-9]|[1-9][0-9]|1[0-7][0-9])\\.[0-9]{6}|180\\.000000)$"
                  },
                  "coordinate_system": {
                    "const": "GCJ02",
                    "type": "string"
                  },
                  "source": {
                    "const": "MAP_PICK",
                    "type": "string"
                  }
                }
              },
              "meeting_time_text": {
                "type": "string",
                "minLength": 0,
                "maxLength": 128
              },
              "instruction": {
                "type": "string",
                "minLength": 0,
                "maxLength": 1000
              }
            }
          },
          "minItems": 0
        },
        "rule_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        },
        "eligibility_rule_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^[!-~]{1,64}$"
        }
      },
      "description": "Complete platform asset terms. No physical identity or server state fields. STORE has 1..3 delivery options; CABINET has none. Exactly one COVER. Source addresses, active rules and immutable snapshots are verified by the transaction."
    },
    "OpsPlatformAssetBatchInput": {
      "additionalProperties": false,
      "properties": {
        "product_id": {
          "maxLength": 64,
          "minLength": 1,
          "type": "string",
          "pattern": "^[!-~]{1,64}$"
        },
        "supply_type": {
          "type": "string",
          "enum": [
            "STORE",
            "CABINET"
          ]
        },
        "identifiers": {
          "maxItems": 100,
          "minItems": 1,
          "items": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "identifier_type": {
                    "type": "string",
                    "enum": [
                      "IMEI",
                      "MANUFACTURER_SERIAL"
                    ]
                  },
                  "identifier": {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": [
                  "identifier_type",
                  "identifier"
                ],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "identifier_type": {
                    "type": "string",
                    "const": "PLATFORM_TAG"
                  },
                  "rfid_code": {
                    "type": "string",
                    "pattern": "^(?!00000000$)[0-9A-Fa-f]{8}$",
                    "minLength": 8,
                    "maxLength": 8
                  }
                },
                "required": [
                  "identifier_type"
                ],
                "type": "object"
              }
            ]
          },
          "type": "array"
        },
        "revision": {
          "$ref": "#/Schemas/OpsPlatformAssetTerms"
        }
      },
      "required": [
        "product_id",
        "supply_type",
        "identifiers",
        "revision"
      ],
      "type": "object",
      "allOf": [
        {
          "if": {
            "required": [
              "supply_type"
            ],
            "properties": {
              "supply_type": {
                "const": "CABINET"
              }
            }
          },
          "then": {
            "properties": {
              "revision": {
                "properties": {
                  "publication_location": false,
                  "delivery_options": {
                    "maxItems": 0
                  }
                }
              }
            }
          }
        },
        {
          "if": {
            "required": [
              "supply_type"
            ],
            "properties": {
              "supply_type": {
                "const": "STORE"
              }
            }
          },
          "then": {
            "properties": {
              "revision": {
                "required": [
                  "publication_location"
                ],
                "properties": {
                  "publication_location": true,
                  "delivery_options": {
                    "minItems": 1
                  }
                }
              }
            }
          }
        }
      ]
    },
