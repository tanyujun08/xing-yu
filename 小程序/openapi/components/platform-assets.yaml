      "required": [
        "min_unit_price_fen",
        "max_unit_price_fen",
        "recommended_unit_price_fen"
      ],
      "properties": {
        "recommended_unit_price_fen": {
          "anyOf": [
            {
              "type": "string",
              "pattern": "^[1-9][0-9]{0,18}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "max_unit_price_fen": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,18}$"
        },
        "min_unit_price_fen": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,18}$"
        }
      },
      "additionalProperties": false,
      "type": "object"
    },
    "OpsPlatformPublicationContext": {
      "required": [
        "product_id",
        "rental_unit",
        "rule_version_id",
        "eligibility_rule_version_id",
        "read_at",
        "pricing_guidance",
        "official_lessor",
        "available_from",
        "available_until",
        "availability_policy"
      ],
      "properties": {
        "pricing_guidance": {
          "anyOf": [
            {
              "$ref": "#/Schemas/OpsPlatformPriceGuidance"
            },
            {
              "type": "null"
            }
          ]
        },
        "read_at": {
          "type": "string",
          "format": "date-time"
        },
        "official_lessor": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "lessor_id",
            "display_name"
          ],
          "properties": {
            "lessor_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "pattern": "^[!-~]{1,64}$"
            },
            "display_name": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          }
        },
        "available_from": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        },
        "available_until": {
          "type": "string",
          "format": "date-time",
          "pattern": "Z$"
        },
        "availability_policy": {
          "type": "string",
          "const": "OPEN_ENDED"
        },
        "rule_version_id": {
          "pattern": "^[!-~]{1,64}$",
          "maxLength": 64,
          "minLength": 1,
          "type": "string"
        },
        "product_id": {
          "pattern": "^[!-~]{1,64}$",
          "maxLength": 64,
          "minLength": 1,
          "type": "string"
        },
        "eligibility_rule_version_id": {
          "pattern": "^[!-~]{1,64}$",
          "maxLength": 64,
          "minLength": 1,
          "type": "string"
        },
        "rental_unit": {
          "type": "string",
          "enum": [
            "HOUR",
            "DAY"
          ]
        },
        "creation_defaults": {
          "required": [
            "rule_version_id",
            "minimum_hourly_hours",
            "minimum_daily_days"
          ],
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "minimum_hourly_hours": {
              "minimum": 12,
              "type": "integer",
              "maximum": 720
            },
            "rule_version_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64
            },
            "minimum_daily_days": {
              "minimum": 3,
              "type": "integer",
              "maximum": 365
            }
          }
        }
      },
      "additionalProperties": false,
      "type": "object"
    }
  }
}
