        官方待取件详情F19展示冻结rental_start_at作为可取件时间；未开始仅等待，不标异常。READ_PICKUP_CODE保持独立资格；OPEN_CABINET若出现在动作投影中，必须受租期窗口守卫约束，F19仍无直接开柜操作。

