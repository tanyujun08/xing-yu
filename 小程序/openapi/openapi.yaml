        - $ref: ./components/protocol.yaml#/IdempotencyKeyParameter
        - $ref: ./components/protocol.yaml#/IfMatchParameter
      responses:
        "200": { description: Updated own authenticator projection., headers: { ETag: { $ref: ./components/protocol.yaml#/ETagHeader } }, content: { application/json: { schema: { $ref: ./components/iam.yaml#/OwnAuthenticators } } } }
