  /v1/callbacks/wechat/payments:
    post:
      operationId: receiveWechatPaymentNotification
      tags:
        - ProviderNotifications
      security: []
      description: >-
        Authenticated WeChat V3 payments ingress. Verify the exact raw body, signature and AEAD with the configured merchant public-key runtime, then
        resolve the original transaction binding from authenticated merchant order/refund identifiers; no user bearer. Reject query, compression, repeated signature headers,
        malformed/duplicate JSON and body over 65536 bytes. Payment accepts TRANSACTION.SUCCESS; refund accepts
        REFUND.SUCCESS/ABNORMAL/CLOSED. Commit deduplicated Inbox, normalized facts and recoverable Worker job before 204.
        Unknown original payment mapping returns 503 without durable acceptance; HTTP never changes an order to paid, refunded or complete.
      parameters:
        - name: Wechatpay-Timestamp
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: ^[1-9][0-9]*$
        - name: Wechatpay-Nonce
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: Wechatpay-Serial
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: Wechatpay-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/wechat-notifications.yaml#/WechatNotificationEnvelope
      responses:
        '204':
          description: >-
            Verified event and recoverable processing responsibility committed; duplicate identical event is acknowledged
            without another job.
        '400':
          description: Malformed headers, body, event or conflicting duplicate identity.
          content:
            application/json:
              schema:
                $ref: ./components/wechat-notifications.yaml#/WechatNotificationFailure
        '401':
          description: Signature, decryption or trusted configuration identity mismatch.
          content:
            application/json:
              schema:
                $ref: ./components/wechat-notifications.yaml#/WechatNotificationFailure
        '413':
          description: Raw body exceeds 65536 bytes.
          content:
            application/json:
              schema:
                $ref: ./components/wechat-notifications.yaml#/WechatNotificationFailure
        '503':
          description: Configuration temporarily unavailable or durable acceptance failed; event is not acknowledged.
          content:
            application/json:
              schema:
                $ref: ./components/wechat-notifications.yaml#/WechatNotificationFailure
