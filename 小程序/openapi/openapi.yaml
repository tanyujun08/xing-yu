    post:
      operationId: R01
      summary: 建立归还上下文
      description: >-
        只创建每单唯一归还记录，submit_at留null；出租方可先准备返程地址；相同method返回原记录；从创建起方式固定且不可切换；未点确认收货不等于未实际交付：可信出柜/发货后实物接收/现场核实能证明本单实际占有时允许归还，不能假填delivered_at。已知交付时间须received_at>=delivered_at；未知交付时间要求官方核实的依据与原因，不能比较NULL后拒绝真实收回。

        仅个人快递返程由出租方R03设置地址，租客R04明确确认最新地址版本后寄回；官方归还固定CABINET，无返程收件地址。

