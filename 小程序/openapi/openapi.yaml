    get:
      operationId: B12
      summary: 后台订单详情
      description: >-
        按后台数据范围授权；敏感地址访问审计。；返回成交asset_snapshot、冻结requirements、各purpose最近任务及同审核版本assessment，公共供给下架不影响读本单快照。

        业务素材由本单冻结/正式绑定的material_id构造只读公开投影；先验证订单角色与字段范围，再读取本单材料。对方资产、归还、官方损失依据无需也不得依赖getMaterial管理读。素材输入/上传状态回读仍由原上传者鉴权。永久URL加载失败只重载同址，不新增签名下载。

        注册候选权限ops.orders.read并核验当前OPS会话及PLATFORM:platform范围；没有权限返回403。动作与字段可见性同源，不能以菜单或x-actor字符串代替IAM。

        可信支付事实与履约资格分开：通知接收晚于付款截止不等于付款超时，按可信paid_at核对原expires_at。原单仍待付、本单资源仍有效且已付款发生于截止前，可记已收并正常推进；处理时租期已结束且未交付则记录原收款并标异常，禁止新发货/交接/取码开柜。已CLOSED或资源不再属于本单时仍保留可信支付事实及已收款，追加PAYMENT_LIFECYCLE_CONFLICT，不重开订单、不重占券/次数/资产、不激活凭证；通过官方外部原路退款及原号查询处理，不伪造未付款。未交付且租期已结束显示RENTAL_TERM_ENDED_UNDELIVERED；租期不顺延，系统不自动退款或完成。

        零现金正式单的安全到期关闭按async-contract.ST19：stage=ACTIVE、initial_due_fen=0且zero_confirmed_at有效，server_now>=rental_end_at；physical_status=NOT_DELIVERED、delivered_at/outbound_shipped_at均为空、无物流记录、无归还/审核/费用责任、无任何支付/退款行；无已派发或在途/UNKNOWN柜机命令，无阻断异常（单独RENTAL_TERM_ENDED_UNDELIVERED除外）。
        显示stage=CLOSED、display_status_code=CLOSED、display_status=“租期结束未交付，订单已关闭”，费用/退款投影不伪造0元交易；权益按原有效期恢复。触发在现有Worker，不由本读取接口写状态。
