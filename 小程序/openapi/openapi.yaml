openapi: 3.1.0
info:
  title: Xingyu Rental API
  version: 1.0.2.0
  description: C2C and B2C rental HTTP contract.
x-contract-revision: XY-20261013-f7e635718a64428fbe99e3ca8081d330
x-xingyu-api-standards:
  json_field_naming: snake_case
  success_envelope: direct
  error_schema: Problem
  default_pagination: cursor
  unknown_request_fields: reject
  timestamp_format: RFC3339_UTC
  money_format: MINOR_UNIT_STRING_WITH_CURRENCY
servers:
  - url: /
paths:
  /v1/client/resources:
    get:
      operationId: getClientResourceManifest
      tags: [Configuration]
      security: []
      description: >-
        Public all-or-nothing manifest for dynamic MINIPROGRAM resources. Exactly one
        client, channel and client_version query value is required; unknown, empty,
        repeated or case-shifted query parameters are rejected with 422. Only the
        currently effective client.resources.MINIPROGRAM v1 policy is read. Entries
        expose READY SYSTEM_ICON or SYSTEM_MATERIAL identities and short-lived HTTPS
        URLs without object keys, bucket names, ownership, scope, scan metadata or
        credentials. The server never reads an optional bearer token, returns a partial
        manifest, falls back to fixed assets, or serves 304. The manifest_id excludes
        signed URLs and expiry times.
      parameters:
        - name: client
          in: query
          required: true
          allowEmptyValue: false
          schema: { type: string, enum: [MINIPROGRAM] }
        - name: channel
          in: query
          required: true
          allowEmptyValue: false
          schema: { type: string, enum: [RELEASE] }
        - name: client_version
          in: query
          required: true
          allowEmptyValue: false
          schema: { type: string, enum: [1.0.0.16] }
      responses:
        "200":
          description: Complete dynamic resource manifest in canonical entry order.
          headers:
            X-Request-ID: { $ref: ./components/protocol.yaml#/RequestIDHeader }
            X-Contract-Revision: { $ref: ./components/protocol.yaml#/ContractRevisionHeader }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientResourceManifest' }
        "409":
          description: The effective configuration or one of its immutable material references is inconsistent.
          content: { application/json: { schema: { $ref: ./components/errors.yaml#/Problem } } }
        "422":
          description: Query parameters do not match the strict MINIPROGRAM/RELEASE/1.0.0.16 contract.
          content: { application/json: { schema: { $ref: ./components/errors.yaml#/Problem } } }
        "429": { $ref: '#/components/responses/ProblemResponse' }
        "500": { $ref: '#/components/responses/ProblemResponse' }
        "503":
          description: No effective client resource configuration exists, or the storage/signing dependency is unavailable.
          content: { application/json: { schema: { $ref: ./components/errors.yaml#/Problem } } }
  /v1/discovery/rental-supplies:
    get:
      operationId: listDiscoveryRentalSupplies
      tags: [Discovery]
      security: []
      description: Anonymous approved, currently discoverable rental supplies. Cursor binds anonymous scope, filters and page size; a page may be empty with has_more after eligibility rechecks. No private material authorization or action authority is conveyed.
      parameters:
        - {in: query, name: city_id, schema: {type: string, minLength: 1, maxLength: 64}}
        - {in: query, name: category_id, schema: {type: string, minLength: 1, maxLength: 64}}
        - {in: query, name: supply_type, schema: {type: string, enum: [PERSONAL, STORE, CABINET]}}
        - {in: query, name: query, schema: {type: string, maxLength: 128}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 4096}}
      responses:
        '200':
          description: Whitelisted anonymous supply page, category facets from the same discoverable set, and normalized filter echo.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: './components/discovery.yaml#/Schemas/DiscoverySupplyPage'}}}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
        '500': {$ref: '#/components/responses/ProblemResponse'}
        '503': {$ref: '#/components/responses/ProblemResponse'}
  /v1/discovery/rental-supplies/{id}:
    get:
      operationId: getDiscoveryRentalSupply
      tags: [Discovery]
      security: []
      description: Anonymous whitelisted current offer; missing, withdrawn and unapproved assets return 404. No query parameters.
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 64}}]
      responses:
        '200':
          description: Current discoverable offer without owner, private location, action, moderation or raw material fields.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: './components/discovery.yaml#/Schemas/DiscoverySupply'}}}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '500': {$ref: '#/components/responses/ProblemResponse'}
        '503': {$ref: '#/components/responses/ProblemResponse'}
  /v1/discovery/stores:
    get:
      operationId: listDiscoveryStores
      tags: [Discovery]
      security: []
      description: Anonymous currently discoverable merchant storefronts from merchant_storefronts. Cursor binds anonymous scope, city filter and page size; no private merchant or contact fields.
      parameters:
        - {in: query, name: city_id, schema: {type: string, minLength: 1, maxLength: 64}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 4096}}
      responses:
        '200':
          description: Whitelisted merchant storefront summaries and normalized city filter echo.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: './components/discovery.yaml#/Schemas/DiscoveryStorePage'}}}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
        '500': {$ref: '#/components/responses/ProblemResponse'}
        '503': {$ref: '#/components/responses/ProblemResponse'}
  /v1/discovery/stores/{id}:
    get:
      operationId: getDiscoveryStore
      tags: [Discovery]
      security: []
      description: Anonymous current merchant storefront detail with approved public operating address, phone and discoverable supplies only. Missing or withdrawn stores return 404. No query parameters.
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 64}}]
      responses:
        '200':
          description: Whitelisted storefront detail without merchant contact name, management, moderation or raw material fields.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: './components/discovery.yaml#/Schemas/DiscoveryStore'}}}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '500': {$ref: '#/components/responses/ProblemResponse'}
        '503': {$ref: '#/components/responses/ProblemResponse'}
  "/v1/rental-supplies":
    get:
      operationId: listRentalSupplies
      tags: [RentalSupplies]
      security: [{bearerAuth: []}]
      description: MINIPROGRAM session. Approved ONLINE supply only, independent quote and create checks. City filter retains EXPRESS supply outside selected city. Cursor binds subject and filters. Candidate scan pages may contain fewer items, including zero with has_more. No business writes or private media authorization implied.
      parameters: [{"name":"query","schema":{"type":"string"},"in":"query"},{"name":"city_id","schema":{"type":"string"},"in":"query"},{"name":"category_id","schema":{"type":"string"},"in":"query"},{"name":"supply_type","schema":{"type":"string"},"in":"query"},{"name":"cursor","schema":{"type":"string"},"in":"query"},{"name":"page_size","schema":{"default":20,"maximum":50,"type":"integer","minimum":1},"in":"query"}]
      responses: {"200":{"content":{"application/json":{"schema":{"$ref":"./components/supplies.yaml#/Schemas/RentalSupplyPage"}}},"description":"Current approved public projection. No private addresses or operational fields."},"400":{"$ref":"#/components/responses/ProblemResponse"},"422":{"$ref":"#/components/responses/ProblemResponse"},"503":{"$ref":"#/components/responses/ProblemResponse"},"404":{"$ref":"#/components/responses/ProblemResponse"},"401":{"$ref":"#/components/responses/ProblemResponse"},"500":{"$ref":"#/components/responses/ProblemResponse"},"403":{"$ref":"#/components/responses/ProblemResponse"}}
  "/v1/rental-supplies/{asset_id}":
    get:
      operationId: getRentalSupply
      tags: [RentalSupplies]
      security: [{bearerAuth: []}]
      description: MINIPROGRAM session. Approved ONLINE supply only, independent quote and create checks. City filter retains EXPRESS supply outside selected city. Cursor binds subject and filters. Candidate scan pages may contain fewer items, including zero with has_more. No business writes or private media authorization implied.
      parameters: [{"required":true,"name":"asset_id","schema":{"minLength":1,"type":"string","maxLength":64},"in":"path"}]
      responses: {"200":{"content":{"application/json":{"schema":{"$ref":"./components/supplies.yaml#/Schemas/RentalSupply"}}},"description":"Current approved public projection. No private addresses or operational fields."},"400":{"$ref":"#/components/responses/ProblemResponse"},"422":{"$ref":"#/components/responses/ProblemResponse"},"503":{"$ref":"#/components/responses/ProblemResponse"},"404":{"$ref":"#/components/responses/ProblemResponse"},"401":{"$ref":"#/components/responses/ProblemResponse"},"500":{"$ref":"#/components/responses/ProblemResponse"},"403":{"$ref":"#/components/responses/ProblemResponse"}}
  "/v1/ops/cash-entries":
    get:
      operationId: "listOpsCashEntries"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.finance.read"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.finance.read with the exact PLATFORM:platform scope. Read-only persisted cash journal lines ordered by created_at DESC, entry_id DESC, with closed owner-bound cursor and strict 400/422 query validation. source_kind selects WITHDRAWAL or PAYOUT; entry_no is the lossless line ordinal rendered as a decimal string; debit_fen and credit_fen are integer fen. The read never posts, reverses or re-prices a journal line."
      parameters:
        - {"in":"query","name":"page_size","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
        - {"in":"query","name":"cursor","schema":{"type":"string","minLength":1,"maxLength":4096}}
        - {"in":"query","name":"account_id","schema":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[!-~]{1,64}$"}}
        - {"in":"query","name":"source_kind","schema":{"type":"string","enum":["WITHDRAWAL","PAYOUT"]}}
        - {"in":"query","name":"created_from","description":"Inclusive UTC lower bound.","schema":{"type":"string","format":"date-time","pattern":"Z$"}}
        - {"in":"query","name":"created_to","description":"Exclusive UTC upper bound; must be later than created_from.","schema":{"type":"string","format":"date-time","pattern":"Z$"}}
      responses:
        "200":
          description: "Authorized cash journal line page."
          headers:
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: ["items","page"]
                properties:
                  items: {"type":"array","items":{"$ref":"./components/ops-finance.yaml#/Schemas/OpsCashEntry"}}
                  page: {"$ref":"./components/pagination.yaml#/CursorPageMeta"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
  "/v1/ops/finance/summary":
    get:
      operationId: "listOpsFinanceSummary"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.finance.read"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.finance.read with the exact PLATFORM:platform scope. Read-only aggregate of persisted CNY cash journal postings inside one closed UTC window. from and to are required canonical UTC values ending in Z, strictly between 1970 and 9999, from < to, at most 366 days. Unknown, repeated or non-canonical parameters return 400; invalid bounds return 422. Cash entry count, debit_fen and credit_fen include zero totals. The read never changes cash state."
      parameters:
        - {"in":"query","name":"from","required":true,"description":"Inclusive UTC lower bound.","schema":{"type":"string","format":"date-time","pattern":"Z$"}}
        - {"in":"query","name":"to","required":true,"description":"Exclusive UTC upper bound.","schema":{"type":"string","format":"date-time","pattern":"Z$"}}
      responses:
        "200":
          description: "Authorized finance aggregate."
          headers:
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
          content:
            application/json:
              schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsFinanceSummary"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
  "/v1/ops/withdrawals":
    get:
      operationId: "listOpsWithdrawals"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.finance.read"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.finance.read with the exact PLATFORM:platform scope. Read-only persisted withdrawal page ordered by created_at DESC, withdrawal_id DESC. Cursor binds operator, OPS audience, scope, every filter and page_size. account_id, status, created_from and created_to are optional; created_from and created_to must arrive as a complete pair, end in Z and stay inside 366 days. Unknown, repeated or empty query parameters, a non-canonical page_size or a cursor minted for other filters are rejected. The read never advances withdrawal, payout or journal state and never calls a payment provider."
      parameters:
        - {"in":"query","name":"page_size","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
        - {"in":"query","name":"cursor","schema":{"type":"string","minLength":1,"maxLength":4096}}
        - {"in":"query","name":"account_id","schema":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[!-~]{1,64}$"}}
        - {"in":"query","name":"status","schema":{"type":"string","enum":["PENDING_REVIEW","APPROVED","PROCESSING","UNKNOWN","SUCCEEDED","REJECTED","FAILED_FINAL"]}}
        - {"in":"query","name":"created_from","description":"Inclusive UTC lower bound.","schema":{"type":"string","format":"date-time","pattern":"Z$"}}
        - {"in":"query","name":"created_to","description":"Exclusive UTC upper bound; must be later than created_from.","schema":{"type":"string","format":"date-time","pattern":"Z$"}}
      responses:
        "200":
          description: "Authorized withdrawal page."
          headers:
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: ["items","page"]
                properties:
                  items: {"type":"array","items":{"$ref":"./components/ops-finance.yaml#/Schemas/OpsWithdrawal"}}
                  page: {"$ref":"./components/pagination.yaml#/CursorPageMeta"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
  "/v1/ops/withdrawals/{withdrawal_id}":
    get:
      operationId: "getOpsWithdrawal"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.finance.read"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.finance.read with the exact PLATFORM:platform scope. Read-only persisted withdrawal projection with masked payee identity, lossless string minor-unit amount and decimal string version. Any query parameter is rejected. The response carries ETag over the representation tag. allowed_actions is a closed set and DECIDE_OPS_WITHDRAWAL is offered only while the withdrawal is PENDING_REVIEW and the operator also holds ops.withdrawals.review; blocked_reasons explains every withheld action. The read never approves, rejects, dispatches or repairs a withdrawal."
      parameters:
        - {"in":"path","name":"withdrawal_id","required":true,"schema":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[!-~]{1,64}$"}}
      responses:
        "200":
          description: "Authorized persisted withdrawal projection."
          headers:
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
            ETag: {"$ref":"#/components/headers/ETag"}
          content:
            application/json:
              schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsWithdrawal"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "404": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
  "/v1/ops/payouts/{payout_id}":
    get:
      operationId: "getOpsPayout"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.finance.read"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.finance.read with the exact PLATFORM:platform scope. Read-only repeatable-read payout projection with masked provider, request number and payee identifiers, lossless string minor-unit amount, decimal string version, the current query-job state and a closed allowed_actions set. QUERY_OPS_PAYOUT is offered only while the payout is UNKNOWN and the operator also holds ops.payouts.recover. Any query parameter is rejected and the read never re-sends a payout or advances provider state."
      parameters:
        - {"in":"path","name":"payout_id","required":true,"schema":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[!-~]{1,64}$"}}
      responses:
        "200":
          description: "Authorized persisted payout projection."
          headers:
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
            ETag: {"$ref":"#/components/headers/ETag"}
          content:
            application/json:
              schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsPayout"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "404": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
  "/v1/ops/payouts/{payout_id}/queries":
    post:
      operationId: "queryOpsPayout"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.payouts.recover"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.payouts.recover with the exact PLATFORM:platform scope. Creates only a query responsibility against the original persisted payout; the HTTP path never calls a payment provider and never creates or resends PAYOUT. An existing unique query job is reused: PENDING is made available, live PROCESSING is left intact, expired PROCESSING is only made available without resetting fence or attempt, and SUCCEEDED, DEAD or CANCELED jobs fail closed with 409. Query parameters, missing or repeated Idempotency-Key, and unknown or extra body fields are rejected. A same-body replay returns the original 202 receipt; a different body with the same key conflicts."
      parameters:
        - {"in":"path","name":"payout_id","required":true,"schema":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[!-~]{1,64}$"}}
        - {"$ref":"#/components/parameters/IdempotencyKey"}
      responses:
        "202":
          description: "Query responsibility accepted against the original payout; provider contact happens only in the worker."
          headers:
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
          content:
            application/json:
              schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsFinanceQueryReceipt"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "404": {"$ref":"#/components/responses/ProblemResponse"}
        "409": {"$ref":"#/components/responses/ProblemResponse"}
        "415": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsFinanceQueryRequest"}
  "/v1/ops/reconciliations":
    post:
      operationId: "createOpsReconciliation"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.reconciliations.create"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.reconciliations.create with the exact PLATFORM:platform scope. Starts one WECHAT bill-import batch for a single business date from an already uploaded bill material and a pinned provider config version; the HTTP path never downloads a bill from the provider. Query parameters, missing or repeated Idempotency-Key, and unknown or extra body fields are rejected, and the business date must be a real calendar date in YYYY-MM-DD. A same-body replay returns 200 with the original batch; a first acceptance returns 202 with a Location header naming the created batch. Import itself happens in the worker."
      parameters:
        - {"$ref":"#/components/parameters/IdempotencyKey"}
      responses:
        "202":
          description: "Import batch accepted for the requested business date."
          headers:
            Location: {"schema":{"type":"string","minLength":1}}
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
          content:
            application/json:
              schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsReconciliationReceipt"}
        "200":
          description: "Same-body replay of an already accepted import batch."
          headers:
            Location: {"schema":{"type":"string","minLength":1}}
            X-Request-ID: {"$ref":"#/components/headers/RequestID"}
            X-Contract-Revision: {"$ref":"#/components/headers/ContractRevision"}
            Cache-Control: {"schema":{"type":"string","const":"no-store"}}
          content:
            application/json:
              schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsReconciliationReceipt"}
        "400": {"$ref":"#/components/responses/ProblemResponse"}
        "401": {"$ref":"#/components/responses/ProblemResponse"}
        "403": {"$ref":"#/components/responses/ProblemResponse"}
        "409": {"$ref":"#/components/responses/ProblemResponse"}
        "415": {"$ref":"#/components/responses/ProblemResponse"}
        "422": {"$ref":"#/components/responses/ProblemResponse"}
        "500": {"$ref":"#/components/responses/ProblemResponse"}
        "503": {"$ref":"#/components/responses/ProblemResponse"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"./components/ops-finance.yaml#/Schemas/OpsReconciliationCreateRequest"}
    get:
      operationId: "listOpsReconciliations"
      tags: ["OpsFinance"]
      security: [{"bearerAuth":[]}]
      x-permission: "ops.finance.read"
      x-scope: "PLATFORM:platform"
      description: "Current OPS account holding ops.finance.read with the exact PLATFORM:platform scope. Read-only import-batch page ordered by created_at DESC, batch_id DESC. provider may only be WECHAT and status only IMPORTING, READY or FAILED. business_date_from and business_date_to are calendar dates in yyyy-mm-dd, must be supplied as a complete pair and may not span more than 366 days. The read never starts, resumes or repairs an import batch."
      parameters:
        - {"in":"query","name":"page_size","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
        - {"in":"query","name":"cursor","schema":{"type":"string","minLength":1,"maxLength":4096}}
        - {"in":"query","name":"provider","schema":{"type":"string","enum":["WECHAT"]}}
