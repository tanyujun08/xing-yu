      description: Current OPS administrator holding ops.audit.read reads one filtered page of login audit ordered by occurred_at DESC, event_id DESC. Every filter is optional and server-validated. account_id narrows to one account, result_code to one recorded outcome, audience to MINIPROGRAM or OPS, and from is inclusive while to is exclusive. An unknown query parameter, a repeated parameter, an empty value, a non-UTC or sub-microsecond timestamp, a non-canonical identifier or a range where from is not before to is rejected with 400 instead of being silently ignored. The signed cursor binds the operator, the OPS audience, the exact filter set and page_size, so a cursor minted under one filter combination is rejected under another one; the read writes one audit event that records the accepted filter set, and an audit success never claims that the underlying login or its external provider call succeeded.
