        仅出租方提前准备返程地址的R01不改变实物状态；承租人开始归还或官方核实后R13，若尚未进入归还则置RETURN_PENDING。已RETURN_IN_TRANSIT/RETURN_VERIFICATION/RECEIVED时回原记录不回退；R01/R13本身不写received_at。
