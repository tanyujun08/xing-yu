            - new fulfillment after rental end without delivery
          complete_check: true
          application_rules:
            - >-
              可信支付事实与履约资格分开：通知接收晚于付款截止不等于付款超时，按可信paid_at核对原expires_at。原单仍待付、本单资源仍有效且已付款发生于截止前，可记已收并正常推进；处理时租期已结束且未交付则记录原收款并标异常，禁止新发货/交接/取码开柜。已CLOSED或资源不再属于本单时仍保留可信支付事实及已收款，追加PAYMENT_LIFECYCLE_CONFLICT，不重开订单、不重占券/次数/资产、不激活凭证；通过官方外部原路退款及原号查询处理，不伪造未付款。未交付且租期已结束显示RENTAL_TERM_ENDED_UNDELIVERED；租期不顺延，系统不自动退款或完成。
            - 已ACTIVE且已交付/已归还的重复初付事实仅幂等核对，不因回执晚于租期再次禁用合法归还/审核或回退物理状态。
            - 已关闭前后出现矛盾现金事实保持原关闭记录及异常；该状态不是资金已清。终态页仍可看原账单和联系客服；仅可信原路全额退款观测能消除对应退款责任。
            - >-
              可信paid_at晚于原expires_at也保留真实收款，但追加PAYMENT_DEADLINE_CONFLICT并禁止本次新的履约推进；不得误当未付关闭。paid_at缺失或无法验证则留原来源待查询，不能用通知接收时间补齐。
        - event: SUPPLEMENT_SUCCEEDED
          source: verified payment callback/query
          guard: purpose=SUPPLEMENT, same unique FINAL review and amount
          writes:
            - rental_payments.status
            - rental_payments.paid_at
            - rental_payments.channel_status
            - rental_payments.channel_observed_at
            - rental_payments.verified_source_kind
            - rental_payments.verified_source_ref
          forbidden:
            - rental_orders.paid_at
            - rental_orders.deposit_received_fen
            - cabinet_credentials.status
            - cabinet_credentials.activated_at
          complete_check: true
        - event: CLOSED_UNPAID
          source: verified unpaid close or never dispatched safe preparation expiry
          guard: no dispatch ambiguity, no paid/unknown cash obligation
          writes:
            - rental_orders.stage
            - rental_orders.closed_at
            - rental_orders.holds_asset
            - rental_order_coupons.status
            - rental_contracts.quota_state
            - entitlement_movements.business_event_key
          forbidden:
            - restore twice
            - extend expired quota lot
          complete_check: false
