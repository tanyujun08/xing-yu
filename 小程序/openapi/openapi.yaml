  /v1/me/rental-cabinet-tasks/{task_id}/open:
    post:
      operationId: K04
      summary: 执行本次开柜
      description: >-
        PICKUP必须6位码并校验绑定本人已付单、原柜格/有效期；RETURN传null。一个任务一个原command_id；ACK仅EXECUTING，业务成功待可信观测。

        原子创建共享命令source_kind=RENTAL、command_type=OPEN_ONE，并由rental_cabinet_tasks.command_id唯一关联；permission_code为rental.cabinet.open、role_snapshot_json=[]、actor取当前承租人及会话。服务端验证本人订单与冻结绑定，不借用管理员OPS权限；RENTAL仅单格开门，禁止批量/紧急开门。
        租期已结束且未实际交付不允许启动新的交付/取件，返回RENTAL_TERM_ENDED_UNDELIVERED并联系官方；不因超时消耗或续期取件码。已发出的原柜机任务仍查原命令/保留实物事实。
        RETURN命令受理后进入RETURN_VERIFICATION等待观测，不能直接RECEIVED；PICKUP按原交付状态等可信结果。

        官方PICKUP只能在 rental_start_at <= server_now < rental_end_at 内新建取件任务及首次派发开柜；以服务端UTC和本单冻结租期为准，客户端时间不授权开门。 租期开始前返回409
        RESOURCE_CONFLICT，BusinessConflictDetails.reason_code=RENTAL_NOT_STARTED；先核验本人、原柜格及输入码，才显示“租期尚未开始，请于YYYY-MM-DD
        HH:mm取件”（北京时间）。错码/他人码/错柜沿统一不可用提示，不披露订单时间。
        受理事务再次检查时间，开始前不创建开门命令；不改本单支付、占用或租期，不因尚未开始标订单异常。明确收到RENTAL_NOT_STARTED后本次提交结束，保留页面输入；到时由用户再次点击产生新意图/新幂等键并重新校验，不自动提交或开门。结果UNKNOWN则先恢复原意图，不能换键。
        等于开始时间可在其余校验通过后取件；等于或晚于结束时间仍按RENTAL_TERM_ENDED_UNDELIVERED处理。已发出或UNKNOWN的原命令只查询并保留可信实物事实，不按时间清除任务或重复派发。该时间限制仅针对新PICKUP，不限制RETURN，不改变个人快递发货及固定租期规则；续租不在本期范围。
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: ^[!-~]+$
          description: 同意图原键重放；作用域绑定主体+operationId，target/正文/If-Match写请求摘要
        - name: If-Match
          in: header
