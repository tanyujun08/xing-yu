      description: >-
        全部必需签署可信成功、条款hash一致、准备占用有效；placed_at首次赋值。initial_due=0直接零现金确认，不生成微信支付；>0进入AWAITING_PAYMENT。B02成功后沿冻结准备条件与hold_expires_at；冻结条款变化须先安全关闭再重新报价签署。

        柜机订单在B02锁有效asset_placements与cabinet_credentials并冻结pickup_placement_id/pickup_credential_id；复核码所属资产、柜格一致及状态可用。B03及初始成功/零现金确认须复核此绑定；管理员移动/出柜/撤销码与本单实物占用互斥。准备阶段不展示码。

        仅零现金确认可在此将本单DORMANT凭证激活；非零现金由可信支付成功处理器激活。同事务写activated_at，未付关闭保留原入柜码DORMANT且不能取货；可信取走后CONSUMED，官方出柜则REVOKED。

        正式确认需全部必需主体已对本单冻结协议明确同意；未完成时返回合同页面阅读同意。协议已留存不等待外部文档。

        期限以服务端UTC为准：准备窗口固定30分钟、首付窗口固定5分钟，不新增运营配置。B02
        hold_expires_at=min(created_at+30分钟,rental_end_at)；仅PREPARING使用此截止。B03在准备有效且租期未结束时置payment_due_at=min(placed_at+5分钟,rental_end_at)，正式待付后只用payment_due_at，不能再因旧hold_expires_at释放。INITIAL.expires_at=payment_due_at；独立补缴责任不超时，每代SUPPLEMENT交易的expires_at=created_at+30分钟（不按已结束租期截短）。刷新/重放/签约回跳不延长任何截止；原代次确认关闭且无在途调用后才可创建下一代。
        到期返回409
        PREPARATION_EXPIRED或RENTAL_TERM_ENDED，禁正式确认/零现金激活；沿B09/到期Worker安全关闭原准备单。非零款剩余支付窗口不足渠道最小窗口时返回PAYMENT_WINDOW_TOO_SHORT，不放宽冻结截止。

        零现金正式单的安全到期关闭按async-contract.ST19：stage=ACTIVE、initial_due_fen=0且zero_confirmed_at有效，server_now>=rental_end_at；physical_status=NOT_DELIVERED、delivered_at/outbound_shipped_at均为空、无物流记录、无归还/审核/费用责任、无任何支付/退款行；无已派发或在途/UNKNOWN柜机命令，无阻断异常（单独RENTAL_TERM_ENDED_UNDELIVERED除外）。
        显示stage=CLOSED、display_status_code=CLOSED、display_status=“租期结束未交付，订单已关闭”，费用/退款投影不伪造0元交易；权益按原有效期恢复。触发在现有Worker，不由前端回调或本次确认请求伪造到期关闭。
