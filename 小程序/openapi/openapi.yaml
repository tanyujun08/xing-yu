  /v1/ops/rental-orders/{order_id}/reviews:
    post:
      operationId: B10
      summary: 保存过程审核或唯一最终核定
      description: >-
        官方保存过程审核或唯一APPROVE_FINAL。先恢复同键同正文原结果，再检查ORDER If-Match与RETURN
        receipt_version；所有归还/材料/收回时间变更同步递增ORDER.version。B10本地事务按与B11相同正文、冻结计价和真实received_at重算。损失项只填description、confirmed_fen、evidence_ids；正金额必须本项有效凭证。过程REVIEW_PENDING或MATERIAL_REQUIRED须原因，未决金额可null，保留全部押金，不创建资金责任；只有APPROVE_FINAL汇总已知损失并要求真实收回、完整照片视频及完整费用。未收回或灭失保持原异常/未决责任，拒绝FINAL，不设独立灭失结算。FINAL正数退押同事务写DEPOSIT退款责任、首笔退款交易与Job；正数补缴同事务形成唯一冻结补缴责任，B04按代次创建SUPPLEMENT交易与Job，同一责任最多一笔活动交易；零退零补同事务completeIfEligible。退款与多代收款全部保留，完成依据责任结清及阻断项，不以存在单条成功流水推导。审批不自动上架，不增加实物检查或复检。

        材料闭环：MATERIAL_REQUIRED写material_status=INCOMPLETE；租客正式补交后为VERIFYING。APPROVE_FINAL同时表示官方已查看本版材料并确认合格，必须先满足本版凭证COMPLETE；服务端仍校验正式绑定的照片/视频READY、数量、用途及归属。B10在同一事务将VERIFYING或COMPLETE写为COMPLETE并写唯一FINAL，递增RETURN与ORDER版本；INCOMPLETE仍阻断FINAL。不得另加材料通过接口或自动把补交等同审核通过。
        过程决定无需实收/完整材料或先成功预览FINAL，可直接保存原因；已有RETURN时receipt_version必传最新version，无RETURN只允许REVIEW_PENDING且receipt_version=null。MATERIAL_REQUIRED必须有原归还上下文。REVIEW_PENDING不改变现有material_status。

        决定到订单审核状态一一映射：REVIEW_PENDING→DISPUTED（费用/事实待官方核实）；MATERIAL_REQUIRED→MATERIAL_REQUIRED；APPROVE_FINAL→FINAL。PENDING只表示首次送审/补交后排队，不表示官方已通过。
        仅原正式订单已结清初付或完成零现金确认且stage=ACTIVE允许此业务写/审核预览；已CLOSED/COMPLETED拒绝新写。原幂等已受理结果按同一身份与原请求恢复，不重新执行。
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: ^[!-~]+$
          description: 同意图原键重放；作用域绑定主体+operationId，target/正文/If-Match写请求摘要
        - name: If-Match
