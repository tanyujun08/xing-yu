      description: >-
        本人租入或出租关系；按角色裁剪收件地址，出租方不回OpenID、预支付等信息。；返回成交asset_snapshot、冻结requirements、各purpose最近任务及同审核版本assessment，公共供给下架不影响读本单快照。

