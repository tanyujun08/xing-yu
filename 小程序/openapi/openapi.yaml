  /v1/me/rental-orders/preparations:
    post:
      operationId: B02
      summary: 锁定准备单
      description: >-
        提交完整QuoteRequest选择与accepted_terms_hash。先恢复同主体同意图原幂等结果；新意图在资源锁保护下复核资格及配置/资产/地址/券/分润版本并重算。规范化摘要不同返回409
        QUOTE_CHANGED，事务不占资产/券/次数；页面重新B01展示差异，用户确认后用新键提交。匹配则一事务建立PREPARING、合同、唯一资产占用及一券/合同次数预留，冻结quote_hash和完整成交快照。准备单只受hold_expires_at及支付截止约束；冻结条件变化须先安全关闭再重新签署。柜机同时锁并冻结有效pickup_placement_id/pickup_credential_id，准备阶段不展示码。官方必须已有效入柜并有关联凭证；地址及物流字段不适用。
        当前公开供给中的旧柜机关闭/个人发件地址阻断须在真实接入后同步新谓词；新流程不能要求个人发件地址。

        期限以服务端UTC为准：准备窗口固定30分钟、首付窗口固定5分钟，不新增运营配置。B02
        hold_expires_at=min(created_at+30分钟,rental_end_at)；仅PREPARING使用此截止。B03在准备有效且租期未结束时置payment_due_at=min(placed_at+5分钟,rental_end_at)，正式待付后只用payment_due_at，不能再因旧hold_expires_at释放。INITIAL.expires_at=payment_due_at；独立补缴责任不超时，每代SUPPLEMENT交易的expires_at=created_at+30分钟（不按已结束租期截短）。刷新/重放/签约回跳不延长任何截止；原代次确认关闭且无在途调用后才可创建下一代。
        租期开始在B01与B02之间过期返回422 QUOTE_INPUT_INVALID，不预占；B02之后开始时间经过可按原固定租期继续签约/付款，必须仍未到结束时间。

        官方设备仅支持租赁柜取还：订单供给仅PERSONAL或OFFICIAL_CABINET；官方交付固定CABINET，allowed_return_methods固定[CABINET]，address_id必须null、运费NOT_APPLICABLE。个人订单仅EXPRESS快递发货和快递寄回，allowed_return_methods固定[EXPRESS]，承租人收件address_id必填；页面只读展示快递，无方式选择器。资产有效配置须包含EXPRESS，否则不可租，不把其他配置自动改写为快递。未入有效柜格或缺有效凭证的官方资产不可报价/下单，不自动降级为物流或面交。
        对官方资产传EXPRESS/ERRAND/IN_PERSON或非空address_id返回422 QUOTE_INPUT_INVALID；当前源码其他官方供给选项不构成本期租赁方式，缺有效入柜位置与凭证时按不可租阻断。
        个人资产必须使用EXPRESS并提供本人的有效收件地址；非EXPRESS、地址为空或资产未配置EXPRESS时返回422 QUOTE_INPUT_INVALID，不占资产、优惠券或合同次数；不能仅凭客户端只读字段放行。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: ^[!-~]+$
          description: 同意图原键重放；作用域绑定主体+operationId，target/正文/If-Match写请求摘要
