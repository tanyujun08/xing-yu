  /v1/me/cabinet-pickups:
    post:
      operationId: K10
      summary: 按扫码柜与本人输入码定位并预留原取件任务
      description: >-
        事务核验scene、本人会话、码HMAC、原订单已付款及原柜格占用，返回唯一任务；不发硬件命令。返回EXECUTING/UNKNOWN/VERIFYING时仅查询原任务；仅RESERVED且允许OPEN才继续K04。无需前端order_id/compartment_id/If-Match；服务端自行锁定版本。K10响应未知同载荷原幂等键恢复，不能创建第二任务。

        通过柜+码HMAC找到凭证，再按pickup_credential_id及holds_asset=1定位唯一在用订单。订单支付成功或zero_confirmed_at有效、本人且实物未交付才可预留；严禁依靠不存在的旧fulfillment_task_id。

        响应丢失且离页后，仅持久化当前主体+scene+原键+operation_id；不持久化明文码。先X01N恢复原任务，再K03；切号清理旧意图。每次K04仍须当前输入与服务端允许状态，不从查询结果推导开门。

        可信支付事实与履约资格分开：通知接收晚于付款截止不等于付款超时，按可信paid_at核对原expires_at。原单仍待付、本单资源仍有效且已付款发生于截止前，可记已收并正常推进；处理时租期已结束且未交付则记录原收款并标异常，禁止新发货/交接/取码开柜。已CLOSED或资源不再属于本单时仍保留可信支付事实及已收款，追加PAYMENT_LIFECYCLE_CONFLICT，不重开订单、不重占券/次数/资产、不激活凭证；通过官方外部原路退款及原号查询处理，不伪造未付款。未交付且租期已结束显示RENTAL_TERM_ENDED_UNDELIVERED；租期不顺延，系统不自动退款或完成。

        官方PICKUP只能在 rental_start_at <= server_now < rental_end_at 内新建取件任务及首次派发开柜；以服务端UTC和本单冻结租期为准，客户端时间不授权开门。 租期开始前返回409
        RESOURCE_CONFLICT，BusinessConflictDetails.reason_code=RENTAL_NOT_STARTED；先核验本人、原柜格及输入码，才显示“租期尚未开始，请于YYYY-MM-DD
        HH:mm取件”（北京时间）。错码/他人码/错柜沿统一不可用提示，不披露订单时间。
        开始前不创建任务、不发命令、不消耗凭证；不改本单支付、占用或租期，不因尚未开始标订单异常。明确收到RENTAL_NOT_STARTED后本次提交结束，保留页面输入；到时由用户再次点击产生新意图/新幂等键并重新校验，不自动提交或开门。结果UNKNOWN则先恢复原意图，不能换键。
        等于开始时间可在其余校验通过后取件；等于或晚于结束时间仍按RENTAL_TERM_ENDED_UNDELIVERED处理。已发出或UNKNOWN的原命令只查询并保留可信实物事实，不按时间清除任务或重复派发。该时间限制仅针对新PICKUP，不限制RETURN，不改变个人快递发货及固定租期规则；续租不在本期范围。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: ^[!-~]+$
          description: 同主体同意图原键；敏感码仅纳入服务端HMAC摘要，禁止明文日志/缓存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CabinetPickupResolveRequest'
      responses:
        '200':
          description: 原取件任务，不表示已经开门
          headers:
            ETag:
              schema:
                type: string
              description: 当前TASK ETag，供K04原If-Match使用
            Cache-Control:
