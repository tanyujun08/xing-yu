        - event: INITIAL_SUCCEEDED
          source: verified payment callback/query
          guard: >-
            purpose=INITIAL, trusted exact merchant/order/currency/amount and payer binding; persist authentic cash even
            if lifecycle conflicts; fulfillment advancement requires original live order/asset binding, payment within
            original deadline, and unexpired undelivered term
          writes:
