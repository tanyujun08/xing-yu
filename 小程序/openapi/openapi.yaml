  /v1/materials/files:
    post:
      operationId: uploadMaterialFile
      tags: [Materials]
      summary: Upload a file independently and return permanent public media when READY.
      description: Multipart file and class with the original Idempotency-Key. The server determines ACCOUNT ownership and verifies real content. Only an OPS uploader with both ops.system_config.write and ops.materials.upload submitting SYSTEM_MATERIAL receives server-derived SYSTEM scope with no scope ID; clients cannot select a scope and Mini users cannot upload this class. Other classes retain ACCOUNT scope. A READY response returns the original public_url and, for video, verified playback_url, metadata and its own poster. Processing returns 202 with explicit null media fields; poll getMaterial with the same material_id. Business writes persist only the original CLIENT_UPLOAD material_id. Permanent anonymous URLs have no browse deadline. A 412 MATERIAL_UPLOAD_EXPIRED confirms only that the original upload acceptance deadline has expired; stop that intent and start a new key only on explicit user action. Other 412 errors, network failures and unknown results do not confirm expiry; retain the original file, class and key, and query an already known material_id.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: ./components/protocol.yaml#/IdempotencyKeyParameter
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, class]
              properties:
                file: { type: string, format: binary }
                class: { $ref: ./components/common.yaml#/MaterialClass }
      responses:
        "201":
          description: READY material and permanent public media.
          content: { application/json: { schema: { $ref: ./components/material-file.yaml#/MaterialFileResult } } }
        "202":
          description: Upload persisted; verification pending. URL fields are null.
          content: { application/json: { schema: { $ref: ./components/material-file.yaml#/MaterialFileResult } } }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "409": { $ref: '#/components/responses/ProblemResponse' }
        "412": { $ref: '#/components/responses/ProblemResponse' }
        "413": { $ref: '#/components/responses/ProblemResponse' }
        "422": { $ref: '#/components/responses/ProblemResponse' }
        "503": { $ref: '#/components/responses/ProblemResponse' }
