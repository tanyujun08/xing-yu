        - { name: audience, in: query, required: false, description: Exact login audience., schema: { type: string, enum: [MINIPROGRAM, OPS] } }
        - { name: from, in: query, required: false, description: Inclusive UTC lower bound., schema: { type: string, format: date-time, pattern: "Z$" } }
        - { name: to, in: query, required: false, description: Exclusive UTC upper bound., schema: { type: string, format: date-time, pattern: "Z$" } }
      responses:
