  /v1/ops/rental-orders/{order_id}/return-draft:
    post:
      operationId: R13
      summary: 官方建立归还上下文
      description: >-
        官方在已实际交付并需要返程/收回时创建唯一归还上下文；官方柜机订单固定CABINET；个人订单固定EXPRESS，界面无方式选择。与R01并发按order唯一复用；不改变实际收回。未点确认收货不等于未交付，官方线下核实后可创建，不需要上传收回依据或填写检查表。

        注册候选权限ops.returns.receive并核验当前OPS会话及PLATFORM:platform范围；没有权限返回403。动作与字段可见性同源，不能以菜单或x-actor字符串代替IAM。

        仅个人快递返程由出租方R03设置地址，租客R04明确确认最新地址版本后寄回；官方归还固定CABINET，无返程收件地址。 影响核费依据的归还/材料变更与ORDER.version递增同事务，旧B11预览失效；不依赖额外预览令牌。

        官方设备仅支持租赁柜取还：订单供给仅PERSONAL或OFFICIAL_CABINET；官方交付固定CABINET，allowed_return_methods固定[CABINET]，address_id必须null、运费NOT_APPLICABLE。个人订单仅EXPRESS快递发货和快递寄回，allowed_return_methods固定[EXPRESS]，承租人收件address_id必填；页面只读展示快递，无方式选择器。资产有效配置须包含EXPRESS，否则不可租，不把其他配置自动改写为快递。未入有效柜格或缺有效凭证的官方资产不可报价/下单，不自动降级为物流或面交。

        仅出租方提前准备返程地址的R01不改变实物状态；承租人开始归还或官方核实后R13，若尚未进入归还则置RETURN_PENDING。已RETURN_IN_TRANSIT/RETURN_VERIFICATION/RECEIVED时回原记录不回退；R01/R13本身不写received_at。
        仅原正式订单已结清初付或完成零现金确认且stage=ACTIVE允许此业务写/审核预览；已CLOSED/COMPLETED拒绝新写。原幂等已受理结果按同一身份与原请求恢复，不重新执行。
        归还method必须属于本单冻结allowed_return_methods；官方仅CABINET、个人仅EXPRESS，非法方法按本接口422拒绝且不创建归还记录。
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: ^[!-~]+$
          description: 同意图原键重放；作用域绑定主体+operationId，target/正文/If-Match写请求摘要
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[A-Za-z0-9._:-]{1,128}"$
          description: 使用最近ORDER对象ETag。不能用裸数字或另一对象版本。
      responses:
        '200':
          description: 复用已有业务对象或同意图回读；不重复创建
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
            ETag:
              schema:
                type: string
              description: 返回对象ETag；OrderDetail取order.version
            X-Contract-Revision:
              $ref: ./components/protocol.yaml#/ContractRevisionHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsReturnView'
        '201':
